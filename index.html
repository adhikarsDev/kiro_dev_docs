/* =====================================================================
   2. DATA GENERATION: buildDatabase(SAMPLE, seed) -> DB (deterministic)
      Sets milestone dates, offers, requests and awaiting items only.
      Stage, SLA status, flags and next action are NEVER stored: the
      rules engine (section 3) derives them from these dates.
   ===================================================================== */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const DAY_MS = 86400000;
function noon(iso) { return new Date(iso + 'T12:00:00'); }          // dates live at local noon (DST-safe)
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
const randInt = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const round100 = n => Math.round(n / 100) * 100;
const AS_OF = noon(SAMPLE.meta.asOf);

// Offer recommendation (DESIGN 6.4). Deterministic and fictional; stored on the property.
function recommendOffer(p, S) {
  const live = p.offers.filter(o => o.status === 'live' || o.status === 'countered');
  if (!live.length || !p.listPrice) return null;
  const sorted = live.slice().sort((a, b) => b.amount - a.amount), best = sorted[0];
  const list = p.listPrice, reserve = p.reserve;
  const pctList = best.amount / list, pctReserve = best.amount / reserve;
  const authority = S.sla.delegatedAcceptPctOfList / 100;
  let action, amount = null, route;
  if (sorted.length >= 3 && (sorted[0].amount - sorted[2].amount) / sorted[0].amount <= 0.03) { action = 'hb'; route = 'none'; }
  else if (pctList >= authority && best.amount >= reserve && (best.financing === 'Cash' || best.financing === 'Conventional')) { action = 'accept'; amount = best.amount; route = 'authority'; }
  else if (best.amount >= reserve) { action = 'counter'; amount = round100(Math.max(list * 0.99, best.amount + (list - best.amount) / 2)); route = 'investor'; }
  else { action = 'counter'; amount = round100(list * 0.98); route = 'investor'; }
  const hist = p.offers.filter(o => ['expired', 'rejected', 'withdrawn'].includes(o.status)).sort((a, b) => b.amount - a.amount)[0];
  const pc = x => Math.round(x * 1000) / 10 + '%';
  const routeText = route === 'authority' ? 'Within AM authority' : route === 'none' ? 'No approval needed to call Highest & Best'
    : best.amount < reserve ? 'Below reserve: investor approval required' : `Below ${S.sla.delegatedAcceptPctOfList}% of list: investor approval required`;
  const summary = action === 'hb' ? `Call Highest & Best: ${sorted.length} offers within 3%`
    : action === 'accept' ? `Accept ${fmtMoney(amount)}` : `Counter at ${fmtMoney(amount)}`;
  return {
    action, amount, route, routeText, summary, agent: action === 'hb' ? 'hb' : 'offer',
    bestOfferId: best.id, bestAmount: best.amount, pctList, pctReserve, offerCount: live.length,
    bullets: [
      `Best offer ${fmtMoney(best.amount)} is ${pc(pctList)} of list and ${pc(pctReserve)} of reserve`,
      `Estimated net to investor ${fmtMoney(best.estNet)}`,
      `${best.financing} financing, ${best.closeDays}-day close, contingencies: ${best.contingencies}`,
      hist ? `Best offer in the last 90 days was ${fmtMoney(hist.amount)} (${hist.status})` : 'No other offers in the last 90 days',
      `${sorted.length} live offer${sorted.length === 1 ? '' : 's'}; list price ${fmtMoney(list)}`
    ]
  };
}

function buildDatabase(S, seed) {
  const r = mulberry32(seed);
  const T = noon(S.meta.asOf);
  const ago = n => addDays(T, -n);
  const props = [], awaiting = [], vals = new Map();
  const seq = { aw: 0, ir: 0, ap: 0, of: 0, ac: 0 };
  const nextId = (k, pre) => pre + String(++seq[k]).padStart(3, '0');
  const used = new Set();
  const count = {}; S.stages.forEach(s => { count[s.key] = 0; });

  function newProp(stage, o = {}) {
    let street, c, loan;
    do { c = pick(r, S.geo.cities); street = `${randInt(r, 100, 9899)} ${pick(r, S.geo.streetNames)} ${pick(r, S.geo.suffixes)}`; } while (used.has(street));
    do { loan = '0097' + String(randInt(r, 100000, 999999)); } while (used.has(loan));
    used.add(street); used.add(loan);
    const pool = o.initialListApproval == null ? S.investors : S.investors.filter(i => !!i.requiresInitialListApproval === o.initialListApproval);
    const inv = pick(r, pool), brk = pick(r, S.brokers);
    const p = {
      id: 0, loan, street, city: c[0], state: c[1], zip: c[2] + String(randInt(r, 0, 99)).padStart(2, '0'),
      investor: inv.name, broker: brk.name, brokerEmail: o.noContact ? null : brk.email,
      assignedAt: null, brokerAssigned: null, equatorSetup: null, occupancyOrderedAt: null, occupancyResult: null, occupancyResultAt: null,
      esdReferredAt: null, evictionCheckins: [], evictionCompleteAt: null,
      servicesOrderedAt: null, resecureConfirmedAt: null, tripleRUpdates: [], trashOutBid: null, trashOutCompleteAt: null,
      valuesOrderedAt: null, valuesUpdatedAt: null, bpoValue: null, botValue: null, valuesReceivedAt: null, botValueAt: null, agreedValue: null, valueAgreedAt: null,
      listingAgreementAt: null, listedAt: null, listPrice: null, reserve: null, priceChanges: [], brokerChecks: [], hubzu: null, reductionReview: null,
      offers: [], recommendation: null, investorRequests: [], approvals: [],
      contractAt: null, closingScheduledAt: null, closingDate: null, closedAt: null,
      actioned: [], snoozes: [], timeline: [],
      agentDecisions: [], startingBid: null      // human reviews of agent results (actions.reviewAgent); starting bid set at push to market
    };
    vals.set(p, round100(randInt(r, 900, 4200) * 100));
    count[stage]++; props.push(p);
    return p;
  }

  // ---- history helpers: h holds day numbers counted from assignment (day 0) ----
  const hIntake = (h = {}) => Object.assign(h, { broker: 0, equator: 0, occOrdered: 0, valuesOrdered: 0 });
  function hEviction(h, lastDay, endDay) {      // occupied at day 1, ESD the same day, weekly check-ins
    h.occResult = 'Occupied'; h.occDay = 1; h.esd = 1; h.checkins = [];
    const stop = endDay != null ? endDay : lastDay;
    for (let d = 8; d < stop; d += 7) h.checkins.push(d);
    if (endDay == null && lastDay > 1 && !h.checkins.includes(lastDay)) h.checkins.push(lastDay);
    if (endDay != null) h.evictDone = endDay;
    return h;
  }
  function hVacantDone(h, v) {                   // full preservation chain ending in a completed trash-out
    h.services = v; h.resecure = v + 1; h.bid = { recv: v + 3, appr: v + 4 }; h.tripleR = [v + 1, v + 3, v + 6, v + 8]; h.trash = v + 8;
    return h;
  }
  const hValues = (h, recv, agree) => Object.assign(h, { valuesOrdered: 0, values: recv, bot: recv, agree: agree == null ? null : agree });
  function hPre(h, occupied) {                   // everything up to (not including) the listing agreement
    hIntake(h); h.occDay = 1;
    let v = 1;
    if (occupied) { const E = randInt(r, 30, 110); hEviction(h, null, E); v = E; } else h.occResult = 'Vacant';
    hVacantDone(h, v); hValues(h, 4, h.trash + 1);
    return h;
  }
  function hListed(h, listAge, priceAge, checkAgo) {   // returns D (days in portfolio)
    h.agreement = h.trash + 3; h.list = h.trash + 5;
    const D = h.list + listAge;
    h.prices = [];
    if (listAge > priceAge) {
      const lastDay = h.list + listAge - priceAge;
      h.prices.push(lastDay);
      for (let d = lastDay - 28; d > h.list + 7; d -= 28) h.prices.unshift(d);
    }
    h.checks = [];
    for (let d = D - checkAgo; d > h.list; d -= 7) h.checks.unshift(d);
    h.lastPrice = h.prices.length ? h.prices[h.prices.length - 1] : h.list;
    return D;
  }

  function apply(p, D, h) {
    p.assignedAt = ago(D);
    const at = n => (n == null ? null : addDays(p.assignedAt, n));
    const val = vals.get(p);
    p.brokerAssigned = at(h.broker); p.equatorSetup = at(h.equator); p.occupancyOrderedAt = at(h.occOrdered);
    p.occupancyResult = h.occResult || null; p.occupancyResultAt = p.occupancyResult ? at(h.occDay) : null;
    p.esdReferredAt = at(h.esd); p.evictionCheckins = (h.checkins || []).map(at); p.evictionCompleteAt = at(h.evictDone);
    p.servicesOrderedAt = at(h.services); p.resecureConfirmedAt = at(h.resecure); p.tripleRUpdates = (h.tripleR || []).map(at);
    if (h.bid) p.trashOutBid = { amount: h.bid.amount || Math.round(randInt(r, 1400, 3600) / 5) * 5, receivedAt: at(h.bid.recv), approvedAt: at(h.bid.appr) };
    p.trashOutCompleteAt = at(h.trash);
    if (p.trashOutBid && p.trashOutBid.approvedAt) p.actioned.push({ id: nextId('ac', 'AC-'), kind: 'trashout', label: 'Triple R trash-out bid', party: 'tripleR', actionedAt: p.trashOutBid.approvedAt, completedAt: p.trashOutCompleteAt });
    p.valuesOrderedAt = at(h.valuesOrdered); p.valuesUpdatedAt = at(h.valuesUpd); p.valuesReceivedAt = at(h.values); p.botValueAt = at(h.bot);
    if (p.valuesReceivedAt) p.bpoValue = val;
    if (p.botValueAt) p.botValue = round100(val * (0.97 + r() * 0.06));
    p.valueAgreedAt = at(h.agree);
    if (p.valueAgreedAt) p.agreedValue = round100((p.bpoValue + p.botValue) / 2);
    p.listingAgreementAt = at(h.agreement); p.listedAt = at(h.list);
    if (p.agreedValue) {
      let price = round100(p.agreedValue * 1.03);
      p.priceChanges = (h.prices || []).map(n => { const to = round100(price * (1 - S.sla.defaultReductionPct / 100)); const ch = { at: at(n), from: price, to }; price = to; return ch; });
      p.listPrice = price; p.reserve = round100(price * 0.9);
    }
    if (p.listedAt) {
      p.brokerChecks = (h.checks || []).map(at);
      p.hubzu = { views: randInt(r, 40, 900), watchers: randInt(r, 0, 40), showings: randInt(r, 0, 12) };
    }
    return at;
  }
  function review(p, at, h, outcome) {
    const day = h.lastPrice + S.sla.reductionEvalDays;
    p.reductionReview = { at: at(day), outcome, pct: S.sla.defaultReductionPct, recommendedPrice: round100(p.listPrice * (1 - S.sla.defaultReductionPct / 100)), requestedAt: null };
  }
  function mkOffer(p, pct, recvAgo, status, fin) {
    const amount = round100(p.listPrice * pct), financing = fin || pick(r, S.financing);
    const o = {
      id: nextId('of', 'OF-'), buyer: pick(r, S.buyerInitials), amount, financing,
      earnest: round100(amount * (0.01 + r() * 0.02)), closeDays: pick(r, [14, 21, 30, 30, 45]),
      contingencies: financing === 'Cash' ? pick(r, ['None', 'Inspection']) : pick(r, S.contingencies),
      receivedAt: ago(recvAgo), status, decidedAt: null
    };
    o.estNet = round100(amount * 0.93 - (financing === 'FHA' || financing === 'VA' ? 2500 : 0));
    p.offers.push(o);
    return o;
  }
  function history(p, listAge) {                 // a few expired / rejected offers from earlier in the listing
    if (listAge < 15 || r() < 0.4) return;
    const n = randInt(r, 1, 3);
    for (let i = 0; i < n; i++) mkOffer(p, 0.8 + r() * 0.12, randInt(r, 10, Math.min(90, listAge - 1)), pick(r, ['expired', 'rejected', 'withdrawn']));
  }
  function mkRequest(p, type, submittedAgo, o = {}) {
    const N = submittedAgo, fu = [];
    if (o.followups !== false) for (let k = S.sla.investorFollowupStartDays; k < N; k++) fu.push(ago(N - k));
    const req = { id: nextId('ir', 'IR-'), type, action: o.action || null, amount: o.amount || null, submittedAt: ago(N), followups: fu, status: o.status || 'open', respondedAt: o.respondedAt || null };
    p.investorRequests.push(req);
    return req;
  }
  function mkAwaiting(p, ruleId, sentAgo, o = {}) {
    const rt = S.rules[ruleId], investor = rt.party === 'investor';
    const sentAt = ago(sentAgo);
    const a = {
      id: nextId('aw', 'AW-'), _p: p, propertyId: 0, ruleId, party: rt.party, templateId: rt.template,
      templateName: (S.templates.find(t => t.id === rt.template) || {}).name || '', to: null,
      subject: '', sentAt, expectedBy: addDays(sentAt, investor ? S.sla.investorResponseDays : S.sla.vendorResponseDays),
      followupNo: o.followupNo || 1, requestId: o.requestId || null, status: 'open'
    };
    awaiting.push(a);
    p.timeline.push({ at: sentAt, source: 'Audit', kind: 'audit', text: `${a.templateName} sent by ${S.user.name} · template ${a.templateId} · simulated` });
    return a;
  }
  // Listed file on market with on-track dates; returns { at, h, D }
  function listedFile(stage, o, listAge, priceAge, checkAgo) {
    const p = newProp(stage, o);
    const h = hPre({}, r() < 0.3);
    const D = hListed(h, listAge, priceAge, checkAgo);
    const at = apply(p, D, h);
    return { p, h, at, D };
  }
  function offersFile(o = {}) {
    const listAge = randInt(r, 20, 120);
    const f = listedFile('offers', o, listAge, randInt(r, 1, Math.min(listAge, 29)), randInt(r, 0, 6));
    history(f.p, listAge);
    return f;
  }

  // ---- 2a. Scenario files (DESIGN 4.4-4.6): exactly the named rule fires ----
  const scen = id => S.scenarios.find(s => s.rule === id) || { days: [], items: [] };
  const ex09 = scen('EX-09').files || [];
  S.scenarios.forEach(sc => {
    const days = sc.days || [], items = sc.items || [];
    switch (sc.rule) {
      case 'EX-01': days.forEach(d => { const p = newProp('intake'); apply(p, d, { broker: 0, equator: 0, valuesOrdered: 0 }); }); break;
      case 'EX-02': days.forEach(k => { const p = newProp('occupancy'); const D = k + 1; apply(p, D, Object.assign(hIntake(), { occOrdered: 1, valuesUpd: D - 1 })); }); break;
      case 'EX-03': days.forEach(k => { const p = newProp('eviction'); const D = k + 2; const h = hValues(hIntake(), 4, 5); h.occResult = 'Occupied'; h.occDay = 2; apply(p, D, h); }); break;
      case 'EX-04': case 'C-01': days.forEach(k => { const p = newProp('eviction'); const D = randInt(r, 40, 90); apply(p, D, hValues(hEviction(hIntake(), D - k), 4, 5)); }); break;
      case 'EX-05': days.forEach(k => { const p = newProp('preservation'); const D = k + 1; apply(p, D, Object.assign(hIntake(), { occResult: 'Vacant', occDay: 1, resecure: 2, valuesUpd: D - 1 })); }); break;
      case 'EX-06': days.forEach(k => { const p = newProp('preservation'); const D = k + 1; apply(p, D, hValues(Object.assign(hIntake(), { occResult: 'Vacant', occDay: 1, services: 1, tripleR: [D - 1] }), 4, 5)); }); break;
      case 'EX-07': days.forEach((d, i) => {
        const p = newProp('preservation');
        const h = Object.assign(hIntake(), { occResult: 'Vacant', occDay: 1, services: 2, resecure: 3, tripleR: [3, 6] });
        if (ex09.includes(i)) h.valuesUpd = d - 2; else hValues(h, 4, 5);
        apply(p, d, h);
      }); break;
      case 'EX-08': days.forEach(d => { const p = newProp('eviction'); const h = hEviction(hIntake(), d - 2); h.valuesUpd = d - 1; apply(p, d, h); }); break;
      case 'EX-10': case 'A-04': days.forEach(k => {
        const p = newProp('valuation'); const h = hVacantDone(Object.assign(hIntake(), { occResult: 'Vacant', occDay: 1 }), 1);
        const D = randInt(r, 16, 24); h.values = D - k; h.bot = D - k; apply(p, D, h);
      }); break;
      case 'EX-11': days.forEach(k => { const p = newProp('listing'); const h = hPre({}, false); apply(p, h.agree + k, h); }); break;
      case 'EX-12': case 'A-03': days.forEach(k => {
        const f = listedFile('market', {}, k + (r() < 0.4 ? 0 : randInt(r, 5, 60)), k, randInt(r, 0, 5));
        review(f.p, f.at, f.h, 'reduce');
      }); break;
      case 'EX-13': sc.requests.forEach(q => {
        if (q.type === 'initial') {
          const p = newProp('listing', { initialListApproval: true }); const h = hPre({}, false);
          const D = h.agree + q.days + 3; h.agreement = D - q.days - 1; apply(p, D, h);
          mkRequest(p, 'initial', q.days, { amount: p.listPrice });
        } else if (q.type === 'reduction') {
          const priceAge = q.days + S.sla.reductionEvalDays + 1;
          const f = listedFile('market', {}, priceAge + randInt(r, 0, 40), priceAge, randInt(r, 0, 5));
          review(f.p, f.at, f.h, 'reduce'); f.p.reductionReview.requestedAt = ago(q.days);
          mkRequest(f.p, 'reduction', q.days, { amount: f.p.reductionReview.recommendedPrice });
        } else {
          const f = offersFile(); const of = mkOffer(f.p, 0.94, q.days + 1, 'live'); of.decidedAt = ago(q.days);
          f.p.recommendation = recommendOffer(f.p, S);
          mkRequest(f.p, 'offer', q.days, { action: f.p.recommendation.action, amount: f.p.recommendation.amount });
        }
      }); break;
      case 'EX-14': days.forEach(k => { const f = offersFile(); mkOffer(f.p, 0.94, k, 'live'); }); break;
      case 'EX-15': case 'A-01': {
        const list = sc.rule === 'EX-15' ? days.map(k => ({ action: 'accept', days: k, pct: 0.95 })) : items;
        list.forEach(it => {
          const f = offersFile(); const of = mkOffer(f.p, it.pct, it.days + 5, 'live', 'Conventional'); of.decidedAt = ago(it.days + 4);
          f.p.recommendation = recommendOffer(f.p, S);
          const amount = it.action === 'accept' ? of.amount : f.p.recommendation.amount;
          const req = mkRequest(f.p, it.action === 'accept' ? 'offer' : 'counter', it.days + 4, { action: it.action, amount, status: 'approved', respondedAt: ago(it.days) });
          f.p.approvals.push({ id: nextId('ap', 'AP-'), requestId: req.id, action: it.action, amount, approvedAt: ago(it.days), executedAt: null });
        });
      } break;
      case 'EX-16': items.forEach(it => {
        const p = newProp('preservation'); const D = it.dip;
        apply(p, D, hValues(Object.assign(hIntake(), { occResult: 'Vacant', occDay: 1, services: 1, resecure: 2, bid: { recv: D - it.days - 1, appr: D - it.days }, tripleR: [2, D - 1] }), 4, 5));
      }); break;
      case 'EX-17': days.forEach(k => {
        const f = listedFile('closing', {}, randInt(r, 60, 120), randInt(r, 1, 29), randInt(r, 0, 6));
        mkOffer(f.p, 0.95, 40, 'accepted'); f.p.contractAt = ago(35); f.p.closingScheduledAt = ago(12); f.p.closingDate = ago(k);
      }); break;
      case 'A-02': items.forEach(it => { const f = offersFile(); it.offers.forEach((pct, i) => mkOffer(f.p, pct, it.days, 'live', i === 0 ? it.financing : 'Conventional')); }); break;
      case 'A-05': items.forEach(it => {
        const p = newProp('preservation'); const D = randInt(r, 6, 12);
        apply(p, D, hValues(Object.assign(hIntake(), { occResult: 'Vacant', occDay: 1, services: 1, resecure: 2, bid: { amount: it.bid, recv: D - it.days, appr: null }, tripleR: [2, D - it.days] }), 4, 5));
      }); break;
      case 'A-06': items.forEach(it => { const p = newProp(it.stage); apply(p, 2, Object.assign(hIntake(), { occResult: it.result, occDay: 2 })); }); break;
      case 'A-07': items.forEach(it => {
        const p = newProp('listing', { initialListApproval: it.initialListApproval }); const h = hPre({}, false);
        const D = h.agree + 2; h.agreement = h.agree + 1; apply(p, D, h);
      }); break;
      case 'C-02': days.forEach(k => {
        const p = newProp('preservation'); const D = randInt(r, 8, 13);
        apply(p, D, hValues(Object.assign(hIntake(), { occResult: 'Vacant', occDay: 1, services: 1, resecure: 2, tripleR: [1, D - k] }), 4, 5));
      }); break;
      case 'C-03': days.forEach(d => { const p = newProp('eviction'); apply(p, d, hEviction(hIntake(), 1)); }); break;
      // priceAge stays < 14 so A-03 does not fire; listAge > k so a broker check exists k days ago
      case 'C-04': days.forEach((k, i) => listedFile('market', { noContact: (sc.noContact || []).includes(i) }, k + randInt(r, 1, 50), randInt(r, 1, 13), k)); break;
      default: break;
    }
  });

  // ---- 2b. Items already sent before today (sit on files whose rule would fire) ----
  S.awaitingSeed.forEach(w => {
    if (w.rule === 'C-02') {
      const p = newProp('preservation'); const D = 10;
      apply(p, D, hValues(Object.assign(hIntake(), { occResult: 'Vacant', occDay: 1, services: 1, resecure: 2, tripleR: [2, D - w.days] }), 4, 5));
      mkAwaiting(p, w.rule, w.sentDaysAgo);
    } else if (w.rule === 'C-01' || w.rule === 'EX-04') {
      const p = newProp('eviction'); const D = randInt(r, 40, 90);
      apply(p, D, hValues(hEviction(hIntake(), D - w.days), 4, 5));
      mkAwaiting(p, w.rule, w.sentDaysAgo);
    } else if (w.rule === 'C-04') {
      const f = listedFile('market', {}, randInt(r, 10, 60), randInt(r, 1, 10), w.days);
      mkAwaiting(f.p, w.rule, w.sentDaysAgo);
    } else if (w.rule === 'EX-11') {
      const p = newProp('listing'); const h = hPre({}, false); apply(p, h.agree + w.days, h);
      mkAwaiting(p, w.rule, w.sentDaysAgo);
    } else if (w.rule === 'EX-13') {
      const f = offersFile(); const of = mkOffer(f.p, 0.92, w.days + 2, 'live'); of.decidedAt = ago(w.days);
      f.p.recommendation = recommendOffer(f.p, S);
      const req = mkRequest(f.p, w.type, w.days, { action: 'counter', amount: f.p.recommendation.amount });
      req.followups.push(ago(w.sentDaysAgo));
      mkAwaiting(f.p, w.rule, w.sentDaysAgo, { requestId: req.id, followupNo: req.followups.length });
    }
  });

  // ---- 2c. Fill every stage up to SAMPLE.stageMix with on-track files ----
  const fill = {
    intake() { const p = newProp('intake'); const D = randInt(r, 0, 1); apply(p, D, { broker: D ? 0 : null, valuesOrdered: 0 }); },
    occupancy() { const p = newProp('occupancy'); apply(p, randInt(r, 0, 2), hIntake()); },
    eviction() { const p = newProp('eviction'); const D = randInt(r, 20, 120); apply(p, D, hValues(hEviction(hIntake(), D - randInt(r, 0, 6)), 4, 5)); },
    preservation() {
      const p = newProp('preservation'); const D = randInt(r, 5, 12);
      apply(p, D, hValues(Object.assign(hIntake(), { occResult: 'Vacant', occDay: 1, services: 1, resecure: 2, tripleR: [1, D - randInt(r, 0, 2)] }), 4, 5));
    },
    valuation() {   // BPO value in; bot-reviewed value still pending (BPO Review agent)
      const p = newProp('valuation'); const h = hPre({}, r() < 0.3);
      h.bot = null; h.agree = null; apply(p, h.trash + randInt(r, 1, 6), h);
    },
    listing() { const p = newProp('listing'); const h = hPre({}, r() < 0.3); apply(p, h.agree + randInt(r, 0, 6), h); },
    market() {
      const priceAge = randInt(r, 1, 29), listAge = priceAge + (r() < 0.35 ? 0 : randInt(r, 5, 140));
      const f = listedFile('market', {}, listAge, priceAge, randInt(r, 0, 6));
      if (priceAge >= S.sla.reductionEvalDays) review(f.p, f.at, f.h, 'hold');
    },
    offers() {
      const f = offersFile();
      if (count.offers % 2) {           // countered, waiting for the buyer
        const of = mkOffer(f.p, 0.88 + r() * 0.06, randInt(r, 8, 12), 'countered'); of.decidedAt = ago(7);
        f.p.recommendation = recommendOffer(f.p, S);
        const req = mkRequest(f.p, 'counter', 7, { action: 'counter', amount: f.p.recommendation.amount, status: 'approved', respondedAt: ago(4) });
        f.p.approvals.push({ id: nextId('ap', 'AP-'), requestId: req.id, action: 'counter', amount: req.amount, approvedAt: ago(4), executedAt: ago(3) });
      } else {                          // decision sent to the investor 0-2 days ago
        const k = randInt(r, 0, 2); const of = mkOffer(f.p, 0.9 + r() * 0.05, k + 2, 'live'); of.decidedAt = ago(k);
        f.p.recommendation = recommendOffer(f.p, S);
        mkRequest(f.p, pick(r, ['offer', 'counter']), k, { action: 'counter', amount: f.p.recommendation.amount });
      }
    },
    contract() {
      const c = randInt(r, 1, 25); const f = listedFile('contract', {}, c + randInt(r, 10, 90), randInt(r, 1, 29), randInt(r, 0, 6));
      mkOffer(f.p, 0.93 + r() * 0.05, c + 4, 'accepted'); f.p.contractAt = ago(c);
    },
    closing() {
      const c = randInt(r, 20, 40); const f = listedFile('closing', {}, c + randInt(r, 10, 60), randInt(r, 1, 29), randInt(r, 0, 6));
      mkOffer(f.p, 0.93 + r() * 0.05, c + 4, 'accepted'); f.p.contractAt = ago(c);
      f.p.closingScheduledAt = ago(randInt(r, 2, 10)); f.p.closingDate = ago(-randInt(r, 1, 14));
    }
  };
  S.stages.forEach(s => { while (count[s.key] < (S.stageMix[s.key] || 0)) fill[s.key](); });

  // ---- 2d. Recommendations, timelines, shuffle and ids ----
  props.forEach(p => { if (!p.recommendation && p.offers.some(o => o.status === 'live' || o.status === 'countered')) p.recommendation = recommendOffer(p, S); });
  props.forEach(p => buildTimeline(p, S));

  p.investorRequests.forEach(q => {

  });
  p.approvals.forEach(a => T(a.executedAt, 'Broker', `${a.action === 'accept' ? 'Acceptance' : 'Counter'} at ${fmtMoney(a.amount)} sent to broker`));

   3. RULES ENGINE: the Asset Management Agent
      RULES = gap rules (DESIGN 4.4-4.6). derive(p, today) returns the

      Thresholds come from SAMPLE.sla; display text from SAMPLE.rules.

// Calendar days between two noon-anchored dates: floor((to - from) / 1 day).
// The 1-hour allowance absorbs the 23-hour day at the spring DST change.
function dayDiff(from, to) { return Math.floor((to - from) / DAY_MS + 1 / 24); }

  since: (d, t) => (d ? dayDiff(d, t) : null),
  last: a => (a && a.length ? a[a.length - 1] : null),
  vacantSince: p => (p.occupancyResult === 'Vacant' ? p.occupancyResultAt : p.evictionCompleteAt),
  intakeDone: p => !!(p.brokerAssigned && p.equatorSetup && p.occupancyOrderedAt),
  live: p => p.offers.filter(o => o.status === 'live' || o.status === 'countered'),
  undecided: p => p.offers.filter(o => o.status === 'live' && !o.decidedAt),
  openReq: (p, type) => p.investorRequests.filter(q => q.status === 'open' && (!type || q.type === type)),
  lastPrice: p => (p.priceChanges.length ? p.priceChanges[p.priceChanges.length - 1].at : p.listedAt),
  bothInAt: p => (p.valuesReceivedAt && p.botValueAt ? (p.valuesReceivedAt > p.botValueAt ? p.valuesReceivedAt : p.botValueAt) : null),
  openApprovals: p => p.approvals.filter(a => !a.executedAt),

// Stage = the earliest blocking step (DESIGN 4.1, order of checks matters)
function stageOf(p) {
  if (p.closingScheduledAt) return 'closing';
  if (p.contractAt) return 'contract';
  if (Rx.live(p).length) return 'offers';
  if (p.listedAt) return 'market';
  if (p.occupancyResult === 'Occupied' && !p.evictionCompleteAt) return 'eviction';
  if (p.occupancyOrderedAt && !p.occupancyResult) return 'occupancy';
  if (!Rx.intakeDone(p)) return 'intake';
  if (!p.trashOutCompleteAt) return 'preservation';
  if (!p.valueAgreedAt) return 'valuation';

function stageEntered(p, stage) {
  switch (stage) {
    case 'intake': return p.assignedAt;
    case 'occupancy': return p.occupancyOrderedAt;
    case 'eviction': return p.occupancyResultAt;
    case 'preservation': return Rx.vacantSince(p) || p.occupancyResultAt || p.assignedAt;
    case 'valuation': return p.trashOutCompleteAt;
    case 'listing': return p.valueAgreedAt > p.trashOutCompleteAt ? p.valueAgreedAt : p.trashOutCompleteAt;
    case 'market': return p.listedAt;
    case 'offers': return Rx.live(p).map(o => o.receivedAt).sort((a, b) => a - b)[0];

    case 'intake': return { day: Rx.dip(p, t), target: S.intakeDays };
    case 'occupancy': return { day: Rx.since(p.occupancyOrderedAt, t), target: S.occupancyResultDays };
    case 'preservation': return { day: Rx.dip(p, t), target: S.trashOutDays };
    case 'listing': return { day: Rx.since(stageEntered(p, stage), t), target: S.listAfterValueDays };
    case 'market': return { day: Rx.since(Rx.lastPrice(p), t), target: S.reductionNeededDom };

    return { daysInGap: d, unit: 'since', gapText: `Last check ${agoText(d)}`, reason: `Hubzu: ${fmtInt(hz.views)} views, ${fmtInt(hz.watchers)} watchers, ${fmtInt(hz.showings)} showings` };
  } }
];
// RULES = logic + display text from SAMPLE.rules (title, party, template, agent, category)
const RULES = RULE_LOGIC.map(x => Object.assign({}, x, SAMPLE.rules[x.id], { id: x.id }));
const ruleById = id => RULES.find(x => x.id === id);

function oldestDueRequest(p, t) {
  return Rx.openReq(p).filter(q => dayDiff(q.submittedAt, t) >= SAMPLE.sla.investorFollowupStartDays && !q.followups.some(f => Rx.sameDay(f, t)))
    .sort((a, b) => a.submittedAt - b.submittedAt)[0] || null;
}
function investorOf(p) { return SAMPLE.investors.find(i => i.name === p.investor) || { name: p.investor, email: null }; }
function partyInfo(p, key) {
  if (key === 'broker') return { key, label: p.broker, email: p.brokerEmail };
  if (key === 'investor') { const i = investorOf(p); return { key, label: i.name, email: i.email }; }
  const x = SAMPLE.parties[key] || { label: key, email: null };
  return { key, label: x.label, email: x.email };
}
const SEV_RANK = { critical: 0, warning: 1 };
const byPriority = (a, b) => (SEV_RANK[a.severity] - SEV_RANK[b.severity]) || (b.daysInGap - a.daysInGap);

function makeHit(rule, p, t, res) {
  const party = res.party || rule.party, template = res.template || rule.template;
  const vars = Object.assign({}, res.vars, { followupNo: res.followupNo });
  const actionText = rule.action.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m));
  return {
    ruleId: rule.id, kind: rule.kind, title: rule.title, severity: rule.severity(p, t), category: rule.category,
    agent: res.agent || rule.agent, party, partyLabel: partyInfo(p, party).label, template, extraTemplates: res.extraTemplates || [],
    daysInGap: res.daysInGap, unit: res.unit, gapText: res.gapText, reason: res.reason, action: actionText,
    followupNo: res.followupNo || 1, requestId: res.requestId || null, approvalId: res.approvalId || null, itemId: res.itemId || null,
    needsApproval: !!res.needsApproval, cc: res.cc || (party === 'investor' ? 'reoManagement' : null), propertyId: p.id
  };
}

function noActionText(p, stage, t) {
  const S = SAMPLE.sla, md = d => fmtMD(d && d > t ? d : addDays(t, 1));
  switch (stage) {
    case 'intake': return `No action: next intake review ${md(addDays(p.assignedAt, S.intakeDays + 1))}`;
    case 'occupancy': return `No action: next occupancy follow-up ${md(addDays(p.occupancyOrderedAt, S.occupancyResultDays + 1))}`;
    case 'eviction': return `No action: next ESD check-in ${md(addDays(Rx.last(p.evictionCheckins) || p.esdReferredAt || t, S.evictionCheckinDays))}`;
    case 'preservation': return `No action: next Triple R check-in ${md(addDays(Rx.last(p.tripleRUpdates) || p.servicesOrderedAt || t, 3))}`;
    case 'valuation': return `No action: next value update ${md(addDays(p.trashOutCompleteAt || t, 3))}`;
    case 'listing': return `No action: next listing follow-up ${md(addDays(p.valueAgreedAt || t, S.listAfterValueDays + 1))}`;
    case 'market': return `No action: next broker check ${md(addDays(Rx.last(p.brokerChecks) || p.listedAt, S.brokerCheckDays))}`;
    case 'offers': return `No action: next buyer response ${md(addDays(t, 1))}`;
    case 'contract': return `No action: next closing check ${md(addDays(p.contractAt, 30))}`;
    case 'closing': return p.closedAt ? `No action: closed ${fmtMD(p.closedAt)}` : `No action: next closing on ${md(p.closingDate)}`;
    default: return `No action: next review ${md(addDays(t, 1))}`;
  }
}

/**
 * derive(p, today) -> { stage, stageLabel, daysInStage, stageTarget, hits[], suppressed[], snoozed[],
 *   sla, slaText, nextAction: { text, kind, ruleId }, moreIssues, waiting }
 * Pure function of the property, DB.awaiting and today. Never writes to p.
 */
function derive(p, today) {
  const t = today || clock.today();
  try {
    const stage = stageOf(p), entered = stageEntered(p, stage);
    const daysInStage = entered ? dayDiff(entered, t) : 0;
    const ck = stageClock(p, stage, t);
    const ctx = { stage };
    const open = DB.awaiting.filter(a => a.propertyId === p.id && a.status === 'open');
    const hits = [], suppressed = [], snoozed = [];
    for (const rule of RULES) {
      const res = rule.test(p, t, ctx); if (!res) continue;
      const h = makeHit(rule, p, t, res);
      const sn = p.snoozes.find(s => s.ruleId === h.ruleId && t < s.until);
      if (sn) { h.snooze = sn; snoozed.push(h); continue; }
      const aw = open.filter(a => a.ruleId === h.ruleId).sort((a, b) => b.sentAt - a.sentAt)[0];
      if (aw) {
        if (t < aw.expectedBy) { h.awaitingId = aw.id; suppressed.push(h); continue; }   // tracked, still within its response SLA
        h.awaitingId = aw.id; h.followupNo = Math.max(h.followupNo, aw.followupNo + 1);
        h.reason = `Follow-up #${h.followupNo} · no response to follow-up sent ${fmtMD(aw.sentAt)} · ${h.reason}`;
        if (h.ruleId === 'EX-13') h.action = SAMPLE.rules['EX-13'].action.replace('{followupNo}', h.followupNo);
      }
      hits.push(h);
    }
    const exc = hits.filter(h => h.kind === 'exception').sort(byPriority);
    const today1 = hits.filter(h => h.ruleId === 'A-01');
    const act = hits.filter(h => h.kind === 'actionable' && h.ruleId !== 'A-01').sort((a, b) => (a.category === 'Moves file forward' ? 0 : 1) - (b.category === 'Moves file forward' ? 0 : 1));
    const chk = hits.filter(h => h.kind === 'checkin');
    // Waiting: tracked sends within SLA, and investor requests not yet due a follow-up
    const waits = open.filter(a => t < a.expectedBy).map(a => {
      const pi = partyInfo(p, a.party === 'item' ? 'tripleR' : a.party);
      const inv = a.party === 'investor';
      return { due: a.expectedBy, label: inv ? 'investor' : pi.label, text: inv ? `Waiting on investor: follow-up #${a.followupNo + 1} due ${fmtMD(a.expectedBy)}` : `Waiting on ${pi.label}: response due ${fmtMD(a.expectedBy)}` };
    });
    Rx.openReq(p).forEach(q => {
      if (hits.some(h => h.requestId === q.id) || open.some(a => a.requestId === q.id && t < a.expectedBy)) return;
      const due = q.followups.length ? addDays(Rx.last(q.followups), 1) : addDays(q.submittedAt, SAMPLE.sla.investorFollowupStartDays);
      waits.push({ due, label: 'investor', text: `Waiting on investor: follow-up #${q.followups.length + 1} due ${fmtMD(due)}` });
    });
    waits.sort((a, b) => a.due - b.due);
    let sla, slaText, nextAction, moreIssues = 0;
    if (exc.length) {
      sla = 'overdue'; slaText = `Overdue · ${Math.max(...exc.map(h => h.daysInGap))}d`;
      nextAction = { text: exc[0].action, kind: 'exception', ruleId: exc[0].ruleId }; moreIssues = exc.length - 1;
    } else if (today1.length) {
      sla = 'today'; slaText = 'Action today'; nextAction = { text: today1[0].action, kind: 'today', ruleId: 'A-01' };
    } else if (act.length) {
      sla = 'ready'; slaText = 'Ready to advance'; nextAction = { text: act[0].action, kind: 'actionable', ruleId: act[0].ruleId };
    } else if (chk.length) {
      sla = 'due'; slaText = 'Check-in due'; nextAction = { text: chk[0].action, kind: 'checkin', ruleId: chk[0].ruleId };
    } else if (waits.length) {
      sla = 'waiting'; slaText = `Waiting on ${waits[0].label} · due ${fmtMD(waits[0].due)}`; nextAction = { text: waits[0].text, kind: 'waiting', ruleId: null };
    } else {
      sla = 'ontrack';
      slaText = ck.target ? `On track · day ${ck.day} of ${ck.target}` : stage === 'eviction' ? `In eviction · day ${daysInStage}` : `On track · day ${ck.day}`;
      nextAction = { text: noActionText(p, stage, t), kind: 'none', ruleId: null };
    }
    return { stage, stageLabel: stageInfo(stage).label, stageEnteredAt: entered, daysInStage, stageTarget: ck.target, hits: exc.concat(today1, act, chk), suppressed, snoozed, sla, slaText, nextAction, moreIssues, waiting: waits[0] || null };
  } catch (e) {
    console.error('derive() failed for property', p && p.id, e);
    return { stage: 'intake', stageLabel: 'Unknown', stageEnteredAt: null, daysInStage: 0, stageTarget: null, hits: [], suppressed: [], snoozed: [], sla: 'error', slaText: 'Data error', nextAction: { text: 'Check sample data', kind: 'error', ruleId: null }, moreIssues: 0, waiting: null, error: true };
  }
}

// Merge-field values for templates (DESIGN 7). _email/_cc are for the drawer's To/Cc fields.
function mergeVars(p, hit, t) {
  t = t || clock.today();
  const party = partyInfo(p, (hit.party) || (SAMPLE.rules[hit.ruleId] || {}).party || 'internal');
  const req = hit.requestId ? p.investorRequests.find(q => q.id === hit.requestId) : null;
  const amt = (hit.vars && hit.vars.amount) || (req && req.amount && fmtMoney(req.amount)) || (p.recommendation && p.recommendation.amount && fmtMoney(p.recommendation.amount))
    || (p.reductionReview && fmtMoney(p.reductionReview.recommendedPrice)) || (p.trashOutBid && fmtMoney(p.trashOutBid.amount)) || '';
  const cc = hit.cc || (party.key === 'investor' ? 'reoManagement' : null);
  return {
    address: p.street, city: `${p.city}, ${p.state} ${p.zip}`, loan: p.loan, investor: p.investor, party: party.label,
    daysInGap: hit.daysInGap != null ? hit.daysInGap : '', daysOutstanding: req ? dayDiff(req.submittedAt, t) : '',
    requestType: req ? SAMPLE.requestTypes[req.type].toLowerCase() : '', submitted: req ? fmtMD(req.submittedAt) : '',
    followupNo: hit.followupNo || 1, listPrice: fmtMoney(p.listPrice), amount: amt, amName: SAMPLE.user.name,
    _email: party.email, _cc: cc ? (SAMPLE.parties[cc] ? SAMPLE.parties[cc].email : cc) : null   // cc: a party key, or an address typed in the drawer
  };
}
function fillTemplate(str, vars) { return String(str).replace(/\{(\w+)\}/g, (m, k) => (Object.prototype.hasOwnProperty.call(vars, k) && vars[k] != null ? String(vars[k]) : m)); }

/* ---- selectors: lists and counts for the screens (all derived; nothing cached) ---- */
const selectors = {
  all(t) { t = t || clock.today(); return DB.properties.map(p => ({ p, d: derive(p, t) })); },
  hits(kind, t) { const out = []; this.all(t).forEach(({ p, d }) => d.hits.forEach(hit => { if (!kind || hit.kind === kind) out.push({ p, d, hit }); })); return out; },
  exceptionGroups(t, sort) {
    const groups = {};
    this.hits('exception', t).forEach(x => { (groups[x.hit.ruleId] = groups[x.hit.ruleId] || { rule: ruleById(x.hit.ruleId), hits: [] }).hits.push(x); });
    const list = Object.values(groups).map(g => {
      g.hits.sort((a, b) => b.hit.daysInGap - a.hit.daysInGap);
      g.oldest = g.hits[0].hit.daysInGap;
      g.severity = g.hits.some(x => x.hit.severity === 'critical') ? 'critical' : 'warning';
      return g;
    });
    return list.sort(sort === 'days' ? (a, b) => b.oldest - a.oldest : (a, b) => (SEV_RANK[a.severity] - SEV_RANK[b.severity]) || (b.oldest - a.oldest));
  },
  exceptionHitCount(t) { return this.hits('exception', t).length; },
  exceptionFileCount(t) { return new Set(this.hits('exception', t).map(x => x.p.id)).size; },
  actionToday(t) { return this.hits('actionable', t).filter(x => x.hit.ruleId === 'A-01'); },
  actionables(t) {
    const xs = this.hits('actionable', t).filter(x => x.hit.ruleId !== 'A-01');
    return { forward: xs.filter(x => x.hit.category === 'Moves file forward'), admin: xs.filter(x => x.hit.category !== 'Moves file forward'), files: new Set(xs.map(x => x.p.id)).size, count: xs.length };
  },
  checkins(t) {
    const xs = this.hits('checkin', t);
    return RULES.filter(x => x.kind === 'checkin').map(rule => ({ rule, hits: xs.filter(x => x.hit.ruleId === rule.id) }));
  },
  checkinCount(t) { return this.hits('checkin', t).length; },
  stageCounts(t) {
    const all = this.all(t);
    return SAMPLE.stages.map(s => {
      const inStage = all.filter(x => x.d.stage === s.key);
      return { key: s.key, label: s.label, color: s.color, count: inStage.length,
        exceptionFiles: inStage.filter(x => x.d.hits.some(h => h.kind === 'exception')).length,
        checkins: inStage.reduce((n, x) => n + x.d.hits.filter(h => h.kind === 'checkin').length, 0) };
    });
  },
  awaiting(t) {
    t = t || clock.today();
    return DB.awaiting.filter(a => a.status === 'open').map(a => {
      const p = DB.properties.find(x => x.id === a.propertyId), daysLeft = dayDiff(t, a.expectedBy);
      return Object.assign({}, a, { property: p, partyLabel: partyInfo(p, a.party === 'item' ? 'tripleR' : a.party).label, daysLeft, late: daysLeft < 0 });
    }).sort((a, b) => a.expectedBy - b.expectedBy);
  },
  investorRequests(t) {
    t = t || clock.today();
    const out = [];
    this.all(t).forEach(({ p, d }) => Rx.openReq(p).forEach(q => {
      const n = dayDiff(q.submittedAt, t), hit = d.hits.find(h => h.requestId === q.id);
      const nextDue = q.followups.length ? addDays(Rx.last(q.followups), 1) : addDays(q.submittedAt, SAMPLE.sla.investorFollowupStartDays);
      out.push({ p, d, req: q, type: SAMPLE.requestTypes[q.type], daysOutstanding: n, followupsSent: q.followups.length, lastFollowup: Rx.last(q.followups), nextDue: nextDue < t ? t : nextDue, dueToday: !!hit, hit: hit || null, status: hit ? 'Follow-up due' : 'With investor' });
    }));
    return out.sort((a, b) => b.daysOutstanding - a.daysOutstanding);
  },
  offers(t) {
    t = t || clock.today();
    return this.all(t).filter(x => x.d.stage === 'offers').map(({ p, d }) => {
      const live = Rx.live(p), best = live.slice().sort((a, b) => b.amount - a.amount)[0];
      const req = Rx.openReq(p).find(q => q.type === 'offer' || q.type === 'counter');
      const appr = Rx.openApprovals(p)[0];
      let status, order;
      if (appr) { status = 'Investor approved: execute today'; order = 0; }
      else if (Rx.undecided(p).length) { status = 'Needs decision'; order = 1; }
      else if (req) { status = `With investor · ${nDays(dayDiff(req.submittedAt, t))}`; order = 2; }
      else { status = 'Countered · awaiting buyer'; order = 3; }
      return { p, d, best, count: live.length, rec: p.recommendation, status, order };
    }).sort((a, b) => a.order - b.order);
  },
  snoozed(t) { const out = []; this.all(t).forEach(({ p, d }) => d.snoozed.forEach(hit => out.push({ p, d, hit }))); return out; },
  // Drafts that replace real research and drafting work: exceptions and decisions. Routine check-ins and the EX-01 checklist don't count.
  draftsCount(t) { return this.hits(null, t).filter(x => x.hit.ruleId !== 'EX-01' && x.hit.kind !== 'checkin').length; },
  hoursSaved(t) { const mins = SAMPLE.researchMinutesBefore - SAMPLE.researchMinutesAfter; return Math.round(this.draftsCount(t) * mins / 60 * 10) / 10; },
  ruleHitCounts(t) { const c = {}; RULES.forEach(x => { c[x.id] = 0; }); this.hits(null, t).forEach(x => { c[x.hit.ruleId]++; }); return c; }
};

/* =====================================================================
   3b. AGENTS: simulated agent results (deterministic; no AI calls)
      Designers: edit agent texts in SAMPLE.agents and SAMPLE.guidelines,
      numbers in SAMPLE.agentParams, and the logic in AGENT_LOGIC below.
      Agents attach to the hits derive() already produces; they add no
      rules and change no counts. agentResult() is pure like derive():
      it is computed on demand and never stored. Human decisions live in
      p.agentDecisions and DB.agentLog, written only by actions.* (section 7).
      AgentResult = { agentId, ruleId, propertyId,
        status: 'ROUTED' | 'BLOCKED' | 'COMPLETE' | 'RETURNED',
        decision: { summary, action?, values? }, rationale: [text],
        guideline: { id, title, text }, confidence: { level: 'High' | 'Medium' | 'Low', pct },
        completeness: { done, total, items: [[label, 'pass' | 'warn' | 'fail', note]] },
        missing: [text], interpret, decide, act, review }
   ===================================================================== */
const AP = SAMPLE.agentParams;
const guidelineById = id => SAMPLE.guidelines.find(g => g.id === id) || null;
/** guidelineText(idOrGuideline): the guideline text with {sla.key} / {param.key} / {param.key.0} filled in. */
function guidelineText(g) {
  const x = typeof g === 'string' ? guidelineById(g) : g;
  if (!x) return '';
  return String(x.text).replace(/\{(sla|param)\.(\w+)(?:\.(\d+))?\}/g, (m, src, key, i) => {
    let v = (src === 'sla' ? SAMPLE.sla : AP)[key];
    if (i != null && Array.isArray(v)) v = v[Number(i)];
    return v == null ? m : String(v);
  });
}
/** agentsForRule(ruleId, p): the agents whose card shows for a hit, in display order. */
function agentsForRule(ruleId, p) {
  switch (ruleId) {
    case 'A-07': return ['cmp', 'srp', 'rmp'];          // plan order: compile, price, review
    case 'A-03': case 'EX-12': return ['rmp'];
    case 'A-04': case 'EX-10': return ['cmp'];
    case 'A-02': case 'EX-14': return [p && p.recommendation ? p.recommendation.agent : 'offer'];
    case 'A-01': case 'EX-15': return ['offer'];
    default: { const r = SAMPLE.rules[ruleId]; return [(r && r.agent) || 'am']; }
  }
}
/** latestDecision(p, agentId, ruleId, t): the newest human decision on this agent result made on the same day as t. */
function latestDecision(p, agentId, ruleId, t) {
  const xs = (p.agentDecisions || []).filter(x => x.agentId === agentId && x.ruleId === ruleId && Rx.sameDay(x.at, t));
  return xs.length ? xs[xs.length - 1] : null;
}
const agClamp = (n, a, b) => Math.max(a, Math.min(b, n));
const agPct = x => `${Math.round(x * 1000) / 10}%`;
const round500 = n => Math.round(n / 500) * 500;
const agReconciled = p => (p.bpoValue && p.botValue ? round100((p.bpoValue + p.botValue) / 2) : p.bpoValue || p.botValue || null);
// BPO vs bot-reviewed spread and the confidence it gives (shared by srp and cmp)
function valueSpread(p) {
  const rv = agReconciled(p);
  if (!(p.bpoValue && p.botValue && rv)) return { spread: null, level: 'Low', pct: 50 };
  const spread = Math.abs(p.bpoValue - p.botValue) / rv;
  return { spread, level: spread <= AP.srpSpreadHigh ? 'High' : spread <= AP.srpSpreadMedium ? 'Medium' : 'Low', pct: agClamp(Math.round(99 - spread * 800), 50, 99) };
}
const levelPct = { High: 92, Medium: 75, Low: 55 };
const isApproved = x => !!x && (x.decision === 'approve' || x.decision === 'edit');

// Offer Acceptance and Highest & Best share one function: it wraps p.recommendation (section 2).
function offerLogic(p, t, hit) {
  const rec = p.recommendation, live = Rx.live(p);
  const ap = hit.approvalId ? p.approvals.find(a => a.id === hit.approvalId) : null;
  const best = (rec && p.offers.find(o => o.id === rec.bestOfferId)) || bestOfferOf(live);
  const fin = best ? best.financing : null, cont = best ? best.contingencies : null;
  const belowReserve = best && p.reserve ? best.amount < p.reserve : false;
  let decision, guideline, rationale;
  if (ap) {   // A-01 / EX-15: the investor already approved; the agent prepares the execution
    const verb = ap.action === 'accept' ? 'acceptance' : 'counter';
    decision = { summary: `Execute the investor-approved ${verb} at ${fmtMoney(ap.amount)}`, action: 'execute', values: { amount: ap.amount } };
    guideline = ap.action === 'accept' ? 'OA-ACC-01' : (p.reserve && ap.amount < p.reserve ? 'OA-CTR-02' : 'OA-CTR-01');
    rationale = [hit.reason, `Investor approved on ${fmtMD(ap.approvedAt)}: guideline ${SAMPLE.rules[hit.ruleId].guideline} asks for execution within ${nDays(SAMPLE.sla.approvedActionDays)}`, `Message drafted to ${p.broker} (template BRK-EXECUTE-01)`];
  } else if (rec) {
    decision = { summary: rec.summary, action: rec.action, values: { amount: rec.amount, route: rec.route } };
    guideline = rec.action === 'hb' ? 'OA-HB-01' : rec.action === 'accept' ? 'OA-ACC-01' : (rec.bestAmount >= p.reserve ? 'OA-CTR-01' : 'OA-CTR-02');
    rationale = rec.bullets.concat([rec.routeText]);
  } else {
    decision = { summary: 'Review the live offers', action: 'review', values: {} };
    guideline = SAMPLE.rules[hit.ruleId].guideline;
    rationale = [hit.reason];
  }
  let level = 'Medium';
  if ((fin === 'Cash' || fin === 'Conventional') && (cont === 'None' || cont === 'Inspection')) level = 'High';
  else if ((fin === 'FHA' || fin === 'VA') && belowReserve) level = 'Low';
  const missing = [];
  if (best && fin === 'Cash' && best.earnest < best.amount * AP.proofOfFundsEarnestPct / 100) missing.push('Proof of funds not on file');
  if (best && (fin === 'FHA' || fin === 'VA')) missing.push('Pre-approval letter not on file');
  const items = [
    ['Best offer', best ? 'pass' : 'fail', best ? `${fmtMoney(best.amount)} from ${best.buyer}` : 'No live offer'],
    ['Reserve on file', p.reserve ? 'pass' : 'fail', p.reserve ? fmtMoney(p.reserve) : 'Missing'],
    ['Financing', best ? 'pass' : 'warn', best ? `${fin}, ${best.closeDays}-day close` : '\u2014'],
    ['Earnest money', missing.includes('Proof of funds not on file') ? 'warn' : 'pass', best ? `${fmtMoney(best.earnest)} (${agPct(best.earnest / best.amount)} of the offer)` : '\u2014'],
    ['Lender letter', missing.includes('Pre-approval letter not on file') ? 'warn' : 'pass', fin === 'FHA' || fin === 'VA' ? 'Pre-approval letter not on file' : 'Not needed']
  ];
  return { decision, rationale, guideline, confidence: { level, pct: levelPct[level] }, items, missing };
}
function bestOfferOf(live) { return live.slice().sort((a, b) => b.amount - a.amount)[0] || null; }

// One shared function for the agents that draft messages: pre, bpo, cfk, inv and am.
function draftLogic(p, t, hit) {
  const tpl = hit.template ? SAMPLE.templates.find(x => x.id === hit.template) : null;
  const vars = mergeVars(p, hit, t), missing = [];
  if (tpl && !vars._email) missing.push(`No contact on file for ${hit.partyLabel}`);
  if (hit.ruleId === 'EX-07' && !p.valuesReceivedAt) missing.push('No values on file: the BPO Review escalation is also open');
  const items = [['Guideline threshold', 'pass', hit.gapText]];
  if (tpl) {
    items.push(['Template', 'pass', `${tpl.name} (${tpl.id})`]);
    items.push(['Contact on file', vars._email ? 'pass' : 'fail', vars._email || `No contact for ${hit.partyLabel}`]);
  } else items.push(['Checklist', 'pass', hit.reason]);
  if (hit.ruleId === 'EX-07') items.push(['Values on file', p.valuesReceivedAt ? 'pass' : 'warn', p.valuesReceivedAt ? 'Received' : 'Not received']);
  const level = missing.length === 0 ? 'High' : missing.length === 1 ? 'Medium' : 'Low';
  return {
    decision: tpl ? { summary: `Drafted ${tpl.name} (${tpl.id}) to ${hit.partyLabel}`, action: 'send', values: { templateId: tpl.id } }
      : { summary: `Prepared the checklist: ${hit.action}`, action: 'checklist', values: {} },
    rationale: [hit.reason, `${hit.gapText} · threshold from SAMPLE.sla`, 'One message per file; you approve before it is sent'],
    guideline: SAMPLE.rules[hit.ruleId].guideline,
    confidence: { level, pct: levelPct[level] }, items, missing
  };
}

/** AGENT_LOGIC[agentId](p, t, hit) -> { decision, rationale, guideline (id), confidence, items, missing }.
    Pure: reads p, DB and SAMPLE, never writes. agentResult() adds status and the Interpret / Decide / Act text. */
const AGENT_LOGIC = {
  // Set Reserve Price: reserve and starting bid for the A-07 marketing plan
  srp(p, t, hit) {
    const list = p.listPrice, agreed = p.agreedValue || agReconciled(p);
    const adj = AP.marketAdj[p.id % AP.marketAdj.length];
    const floor = agreed ? Math.ceil(agreed * AP.reserveFloorPctOfValue / 100 / 100) * 100 : 0;
    const raw = list ? round100(list * (AP.reservePctOfList / 100 + adj)) : null;
    const reserve = raw != null ? Math.max(raw, floor) : null;
    const startingBid = reserve != null ? round500(reserve * AP.startingBidPctOfReserve / 100) : null;
    const vs = valueSpread(p), missing = [];
    if (vs.spread != null && vs.spread > AP.srpSpreadMedium) missing.push(`BPO and bot-reviewed values differ by ${agPct(vs.spread)}: confirm the comps`);
    missing.push('No Hubzu activity yet (not listed): trend taken from city comps');
    const adjText = `${adj > 0 ? '+' : ''}${Math.round(adj * 100)}%`;
    return {
      decision: reserve != null ? { summary: `Reserve ${fmtMoney(reserve)} · starting bid ${fmtMoney(startingBid)}`, action: 'set-reserve', values: { reserve, startingBid, listPrice: list } }
        : { summary: 'No list price yet: reserve cannot be set', action: 'set-reserve', values: {} },
      rationale: [
        `List price ${fmtMoney(list)} × ${AP.reservePctOfList}% reserve ratio (guideline PG-RES-01)`,
        `Local market trend (fictional) ${adjText} for ${titleCase(p.city)}`,
        `Floor ${AP.reserveFloorPctOfValue}% of the agreed value ${fmtMoney(agreed)} = ${fmtMoney(floor)}${raw != null && raw < floor ? ': floor applied' : ': not binding'}`,
        `Starting bid ${AP.startingBidPctOfReserve}% of the reserve, rounded to $500 (guideline PG-BID-01)`,
        vs.spread != null ? `BPO ${fmtMoney(p.bpoValue)} and bot-reviewed ${fmtMoney(p.botValue)} are ${agPct(vs.spread)} apart` : 'Only one value on file'
      ],
      guideline: 'PG-RES-01',
      confidence: { level: vs.level, pct: vs.pct },
      items: [
        ['Agreed value', agreed ? 'pass' : 'fail', fmtMoney(agreed)],
        ['List price', list ? 'pass' : 'fail', fmtMoney(list)],
        ['BPO and bot-reviewed values', vs.spread == null ? 'warn' : vs.spread > AP.srpSpreadMedium ? 'warn' : 'pass', vs.spread == null ? 'Only one value on file' : `${agPct(vs.spread)} apart`],
        ['Market trend', 'pass', `City comps (fictional): ${adjText}`]
      ],
      missing
    };
  },

  // Complete Marketing Plan: the A-07 plan, or the value and list price on A-04 / EX-10
  cmp(p, t, hit) {
    const vs = valueSpread(p);
    if (hit.ruleId === 'A-04' || hit.ruleId === 'EX-10') {
      const rv = agReconciled(p), list = rv ? round100(rv * AP.listPctOfValue / 100) : null, missing = [];
      if (vs.spread != null && vs.spread > AP.srpSpreadMedium) missing.push(`BPO and bot-reviewed values differ by ${agPct(vs.spread)}: confirm the comps`);
      return {
        decision: { summary: `Agree value ${fmtMoney(rv)} · list at ${fmtMoney(list)}`, action: 'agree-value', values: { value: rv, listPrice: list } },
        rationale: [`BPO ${fmtMoney(p.bpoValue)} and bot-reviewed ${fmtMoney(p.botValue)} reconcile to ${fmtMoney(rv)}`, `Proposed list price ${AP.listPctOfValue}% of the value (guideline MP-CMP-02)`, `${hit.gapText}: guideline ${SAMPLE.rules[hit.ruleId].guideline} asks for agreement within ${nDays(SAMPLE.sla.valueReviewDays)}`],
        guideline: 'MP-CMP-02',
        confidence: { level: vs.level, pct: vs.pct },
        items: [
          ['BPO value', p.bpoValue ? 'pass' : 'fail', fmtMoney(p.bpoValue)],
          ['Bot-reviewed value', p.botValue ? 'pass' : 'fail', fmtMoney(p.botValue)],
          ['Values agree within 5%', vs.spread != null && vs.spread <= AP.srpSpreadMedium ? 'pass' : 'warn', vs.spread != null ? `${agPct(vs.spread)} apart` : '\u2014'],
          ['Comps (3 sold within 1 mile)', 'pass', 'On file']
        ],
        missing
      };
    }
    const srpOk = isApproved(latestDecision(p, 'srp', hit.ruleId, t));
    const photosDue = p.listingAgreementAt ? addDays(p.listingAgreementAt, AP.photosDueDays) : null;
    const items = [
      ['Agreed value', p.agreedValue ? 'pass' : 'fail', fmtMoney(p.agreedValue)],
      ['List price', p.listPrice ? 'pass' : 'fail', fmtMoney(p.listPrice)],
      ['Reserve and starting bid', srpOk ? 'pass' : 'warn', srpOk ? 'Approved' : 'Waiting for your Set Reserve Price approval'],
      ['Listing agreement', p.listingAgreementAt ? 'pass' : 'fail', p.listingAgreementAt ? `Received ${fmtMD(p.listingAgreementAt)}` : 'Not received'],
      ['Hubzu listing draft', p.listingAgreementAt ? 'pass' : 'warn', p.listingAgreementAt ? 'Draft ready to publish at push' : 'Needs the listing agreement'],
      ['Interior photos', 'warn', `Task created for ${p.broker}, due ${fmtMD(photosDue)}`]
    ];
    if (hit.needsApproval) items.push(['Initial-list approval', 'warn', 'Send the initial list request']);
    const tasks = [{ label: 'Interior photos', owner: p.broker, due: photosDue }, { label: 'Publish on Hubzu at push', owner: 'Hubzu', due: null }];
    if (hit.needsApproval) tasks.push({ label: 'Initial list request', owner: p.investor, due: t });
    const done = items.filter(x => x[1] === 'pass').length;
    return {
      decision: { summary: `Marketing plan ${done} of ${items.length} elements ready · ${plural(tasks.length, 'task')} created`, action: 'complete-plan', values: { tasks } },
      rationale: [`Plan elements from guideline MP-CMP-01`, `Listing agreement from ${p.broker} received ${fmtMD(p.listingAgreementAt)}`].concat(tasks.map(x => `Task: ${x.label} (${x.owner}${x.due ? ', due ' + fmtMD(x.due) : ''})`)),
      guideline: 'MP-CMP-01',
      confidence: { level: done >= items.length - 2 ? 'High' : 'Medium', pct: done >= items.length - 2 ? 90 : 75 },
      items, missing: []
    };
  },

  // Review Marketing Plan: the A-07 plan review, or the reduction case on A-03 / EX-12
  rmp(p, t, hit) {
    if (hit.ruleId === 'A-03' || hit.ruleId === 'EX-12') {
      const rr = p.reductionReview, list = p.listPrice;
      const price = rr ? rr.recommendedPrice : round100(list * (1 - SAMPLE.sla.defaultReductionPct / 100));
      const pct = rr ? rr.pct : SAMPLE.sla.defaultReductionPct, hz = p.hubzu, d = Rx.since(Rx.lastPrice(p), t);
      const g = SAMPLE.rules[hit.ruleId].guideline, ex = hit.ruleId === 'EX-12';
      return {
        decision: { summary: `Reduce ${pct}% from ${fmtMoney(list)} to ${fmtMoney(price)}`, action: 'reduce', values: { price } },
        rationale: [hit.reason, `${d} days since ${p.priceChanges.length ? 'the last price change' : 'listing'}: guideline ${g} threshold is ${ex ? SAMPLE.sla.reductionNeededDom : SAMPLE.sla.reductionEvalDays} days`,
          hz ? `Hubzu: ${fmtInt(hz.views)} views, ${fmtInt(hz.watchers)} watchers, ${fmtInt(hz.showings)} showings` : 'No Hubzu activity on file', `${p.investor} must approve the reduction`],
        guideline: g,
        confidence: ex ? { level: 'High', pct: 90 } : { level: 'Medium', pct: 75 },
        items: [
          ['Days at current price', 'pass', `${d} days`],
          ['Hubzu activity', hz ? 'pass' : 'warn', hz ? `${fmtInt(hz.showings)} showings` : 'None on file'],
          ['Accepted offers', 'pass', 'None'],
          ['Proposed price below list', price < list ? 'pass' : 'fail', fmtMoney(price)]
        ],
        missing: hz ? [] : ['No Hubzu activity on file']
      };
    }
    const srp = latestDecision(p, 'srp', hit.ruleId, t);
    const ratio = p.agreedValue && p.listPrice ? p.listPrice / p.agreedValue * 100 : null;
    const band = AP.listPriceBandPct, laDays = p.listingAgreementAt ? Rx.since(p.listingAgreementAt, t) : null;
    const checks = [
      ['MP-REV-01', 'List price within band', ratio != null && ratio >= band[0] && ratio <= band[1] ? 'pass' : 'fail', ratio != null ? `${Math.round(ratio * 10) / 10}% of the agreed value` : 'No agreed value'],
      ['MP-REV-02', 'Reserve approved', srp ? (isApproved(srp) ? 'pass' : 'fail') : 'warn', srp ? (isApproved(srp) ? 'Approved via Set Reserve Price' : 'Set Reserve Price recommendation returned') : 'Waiting for your Set Reserve Price approval'],
      ['MP-REV-03', 'Listing agreement current', laDays != null && laDays <= AP.listingAgreementMaxDays ? 'pass' : 'fail', laDays != null ? `${nDays(laDays)} old` : 'Not received'],
      ['MP-REV-04', 'Initial list approval', hit.needsApproval ? 'warn' : 'pass', hit.needsApproval ? `${p.investor} requires it: not yet requested` : 'Not required'],
      ['MP-REV-05', 'Photos live within 3 days', 'warn', `Photos task open with ${p.broker}`]
    ];
    const fails = checks.filter(c => c[2] === 'fail').length, warns = checks.filter(c => c[2] === 'warn').length;
    const verdict = fails ? 'Corrections needed' : warns ? `Ready to advance with ${plural(warns, 'follow-up')}` : 'Ready to advance';
    const first = checks.find(c => c[2] !== 'pass');
    const level = fails ? 'Low' : warns <= 2 ? 'High' : 'Medium';
    return {
      decision: { summary: verdict, action: fails ? 'correct' : 'advance', values: { fails, warns } },
      rationale: checks.map(c => `${c[0]} ${c[1]}: ${c[2] === 'pass' ? 'pass' : c[2] === 'warn' ? 'follow-up' : 'fails'} (${c[3]})`),
      guideline: first ? first[0] : 'MP-REV-01',
      confidence: { level, pct: agClamp(95 - 5 * warns - 20 * fails, 50, 99) },
      items: checks.map(c => [c[1], c[2], c[3]]),
      missing: checks.filter(c => c[2] === 'fail').map(c => `${c[1]}: ${c[3]}`)
    };
  },

  offer: offerLogic,
  hb: offerLogic,
  pre: draftLogic, bpo: draftLogic, cfk: draftLogic, inv: draftLogic, am: draftLogic
};

/** agentResult(agentId, p, t, hit) -> AgentResult (see the banner above), or null when the file has no matching hit.
    hit may be a hit object, a rule id, or omitted (first hit this agent works on). Pure: never writes to p or DB. */
function agentResult(agentId, p, t, hit) {
  t = t || clock.today();
  if (!p || !AGENT_LOGIC[agentId]) return null;
  if (!hit || typeof hit === 'string') {
    const hs = derive(p, t).hits;
    hit = hs.find(h => (typeof hit === 'string' ? h.ruleId === hit : true) && agentsForRule(h.ruleId, p).includes(agentId)) || null;
    if (!hit) return null;
  }
  const r = AGENT_LOGIC[agentId](p, t, hit);
  const g = guidelineById(r.guideline) || { id: r.guideline, title: '', text: '' };
  const items = r.items || [];
  const done = items.filter(x => x[1] === 'pass').length;
  const review = latestDecision(p, agentId, hit.ruleId, t);
  const status = review ? (review.decision === 'reject' ? 'RETURNED' : 'COMPLETE') : items.some(x => x[1] === 'fail') ? 'BLOCKED' : 'ROUTED';
  const act = status === 'BLOCKED' ? 'Blocked: routed to you as an exception'
    : status === 'COMPLETE' ? `You ${review.decision === 'edit' ? 'edited' : 'approved'} this recommendation today`
    : status === 'RETURNED' ? 'You rejected this recommendation today' : 'You review: approve, edit or reject';
  return {
    agentId, ruleId: hit.ruleId, propertyId: p.id, status,
    decision: r.decision, rationale: r.rationale || [],
    guideline: { id: g.id, title: g.title, text: guidelineText(g) },
    confidence: r.confidence, completeness: { done, total: items.length, items }, missing: r.missing || [],
    interpret: `Read guideline ${g.id} and ${plural(items.length, 'fact')}`, decide: r.decision.summary, act,
    review
  };
}

/* ---- agent selectors (added to the selectors object above) ---- */
const CATALOG_AGENTS = ['srp', 'rmp', 'cmp', 'offer'];
Object.assign(selectors, {
  /** agentQueue(agentId, t) -> [{ p, d, hit, res }]: hits this agent works on. am = every exception (res from the hit's own agent). */
  agentQueue(agentId, t) {
    t = t || clock.today();
    if (agentId === 'am') return this.hits('exception', t).map(x => Object.assign({}, x, { res: agentResult(agentsForRule(x.hit.ruleId, x.p)[0], x.p, t, x.hit) }));
    return this.hits(null, t).filter(x => agentsForRule(x.hit.ruleId, x.p).includes(agentId)).map(x => Object.assign({}, x, { res: agentResult(agentId, x.p, t, x.hit) }));
  },
  /** agentQueueCount(t): unique hits waiting on the four catalog agents (srp, rmp, cmp, offer). */
  agentQueueCount(t) {
    const keys = new Set();
    CATALOG_AGENTS.forEach(a => this.agentQueue(a, t).forEach(x => keys.add(`${x.p.id}|${x.hit.ruleId}`)));
    return keys.size;
  },
  /** agentOvernight() -> [{ agentId, prepared, rules: { ruleId: n } }] from the overnight run (SAMPLE.agents order). */
  agentOvernight() {
    const by = {};
    DB.agentLog.filter(e => e.kind === 'run' && e.overnight).forEach(e => {
      const g = by[e.agentId] = by[e.agentId] || { agentId: e.agentId, prepared: 0, rules: {} };
      g.prepared++; g.rules[e.ruleId] = (g.rules[e.ruleId] || 0) + 1;
    });
    return SAMPLE.agents.map(a => by[a.id]).filter(Boolean);
  },
  /** agentLog({ kind, agentId, limit }) -> DB.agentLog entries, newest first. */
  agentLog(f = {}) {
    const xs = DB.agentLog.map((e, i) => ({ e, i })).filter(({ e }) => (!f.kind || e.kind === f.kind) && (!f.agentId || e.agentId === f.agentId));
    xs.sort((a, b) => (b.e.at - a.e.at) || (b.i - a.i));
    const out = xs.map(x => x.e);
    return f.limit ? out.slice(0, f.limit) : out;
  }
});

/* ---- Modal ---- */
function openModal({ title = '', body = '', size = 'md', footer = null, headerActions = '', onMount }) {
  const root = $('#overlay-root');
  const wrap = document.createElement('div');
  wrap.className = 'backdrop';
  wrap.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true"><div class="modal-h">${typeof title === 'string' && !title.startsWith('<') ? `<h2>${esc(title)}</h2>` : title}<div class="acts">${headerActions}<button class="icon-btn plain" data-close aria-label="Close">${I('x', 18)}</button></div></div><div class="modal-b">${body}</div>${footer !== null ? `<div class="modal-f">${footer}</div>` : ''}</div>`;
  const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  on(wrap, '[data-close]', 'click', close);
  document.addEventListener('keydown', onKey);
  root.appendChild(wrap);
  if (onMount) onMount($('.modal', wrap), close);
  return close;
}
/* ---- Right-side drawer ---- */
function openDrawer(html, onMount) {

/* ---- Data table: sortable, paginated, draggable columns ----
   mountTable(container, {columns, rows, pageSize, pageSizes, sort:{key,dir}, onRowClick, empty, compact, rowClass})
   column: {key, label, align, sortable(default true), render(row), value(row) for sorting, width}
   Returns {update(rows), render} so screens can push filtered rows in. */
function mountTable(container, cfg) {
  const st = { rows: cfg.rows || [], page: 0, size: cfg.pageSize || 25, sort: cfg.sort || null, cols: cfg.columns.slice() };
  function sorted() {
    if (!st.sort) return st.rows;
    const col = st.cols.find(c => c.key === st.sort.key); if (!col) return st.rows;
    const val = col.value || (r => r[col.key]);
    return st.rows.slice().sort((a, b) => { let x = val(a), y = val(b); if (x == null) x = -Infinity; if (y == null) y = -Infinity; if (x instanceof Date) { x = +x; y = +y; } return (x > y ? 1 : x < y ? -1 : 0) * (st.sort.dir === 'asc' ? 1 : -1); });
  }
  function render() {
    const all = sorted(), total = all.length, pages = Math.max(1, Math.ceil(total / st.size));
    if (st.page >= pages) st.page = pages - 1;
