// "Update received, not complete": counts as the vendor's latest update
function updateMilestone(p, ruleId, t) {
  if (['EX-05', 'EX-07', 'C-02', 'A-05', 'EX-16'].includes(ruleId)) p.tripleRUpdates.push(t);
  else if (['EX-08', 'EX-09', 'C-03'].includes(ruleId)) p.valuesUpdatedAt = t;
  else if (['EX-04', 'C-01'].includes(ruleId)) p.evictionCheckins.push(t);
  else if (ruleId === 'C-04') p.brokerChecks.push(t);
}

const actions = {
  /** send(hitRefs, {subject, body, templateId, cc}) -> {ok, sent, skipped, skippedIds, items, expectedBy}
      One message per file. Files with no contact on record are skipped. */
  send(hitRefs, opts = {}) {
    const t = clock.today(), refs = Array.isArray(hitRefs) ? hitRefs : [hitRefs];
    let sent = 0, skipped = 0, stale = 0; const items = [], skippedIds = [];
    refs.forEach(ref => {
      const p = findProperty(ref.propertyId), hit = p && activeHit(p, [ref.ruleId], t);
      if (!hit) { stale++; return; }
      const templates = opts.templateId ? [opts.templateId] : [hit.template].concat(hit.extraTemplates || []);
      const vars = mergeVars(p, hit, t);
      if (!vars._email) { skipped++; skippedIds.push(p.id); return; }
      if (hit.ruleId === 'EX-03' || (hit.ruleId === 'A-06' && p.occupancyResult === 'Occupied')) p.esdReferredAt = t;
      if (hit.ruleId === 'EX-05' || (hit.ruleId === 'A-06' && p.occupancyResult === 'Vacant')) p.servicesOrderedAt = t;
      let followupNo = hit.followupNo;
      if (hit.ruleId === 'EX-13') { const q = p.investorRequests.find(x => x.id === hit.requestId); q.followups.push(t); followupNo = q.followups.length; }
      const ag = hit.agent || 'am';   // EX-17 has no primary agent: the Asset Management Agent drafts it
      let logText = null, logEdited = false;
      templates.forEach((tid, i) => {
        const tpl = tplById(tid), party = i === 0 ? hit.party : (tpl ? tpl.party : hit.party);
        const v = i === 0 ? Object.assign({}, vars, { followupNo }) : mergeVars(p, Object.assign({}, hit, { party }), t);
        // Edited subject/body/cc apply to the first (drafted) message; extra messages (A-06 vacant: AFS) keep their template
        const own = i === 0 ? opts : {};
        const subject = fillTemplate(own.subject != null ? own.subject : (tpl ? tpl.subject : hit.title), v);
        const body = fillTemplate(own.body != null ? own.body : (tpl ? tpl.body : ''), v);
        const edited = subject !== fillTemplate(tpl ? tpl.subject : hit.title, v) || body !== fillTemplate(tpl ? tpl.body : '', v);
        const a = track(p, { ruleId: hit.ruleId, party, templateId: tid, to: v._email, cc: own.cc != null ? own.cc : v._cc, subject, body, followupNo, requestId: hit.requestId }, t);
        items.push(a);
        const label = hit.kind === 'exception' ? (followupNo > 1 ? `Follow-up #${followupNo}` : 'Follow-up') : hit.kind === 'checkin' ? 'Check-in' : (tpl ? tpl.name : 'Message');
        const text = `${label} sent by ${SAMPLE.user.name} · template ${tid} · drafted by ${agentName(ag)} (${edited ? 'edited' : 'approved as drafted'})`;
        audit(p, text, t);
        if (i === 0) { logText = text; logEdited = edited; }
      });
      logDecision(p, ag, hit.ruleId, logEdited ? 'edit' : 'approve', logText, t);
      sent++;
    });
    if (!sent && !skipped) return handled(refs.map(x => `${x.ruleId}#${x.propertyId}`).join(', '));
    return { ok: sent > 0, sent, skipped, stale, skippedIds, items, expectedBy: items.length ? items[0].expectedBy : null, reason: sent ? null : 'No contact on file' };
  },

  approveBid(propertyId, o = {}) {
    const t = clock.today(), p = findProperty(propertyId), hit = p && activeHit(p, ['A-05'], t);
    if (!hit) return handled(`A-05#${propertyId}`);
    const at = attribution(p, hit, hit.agent || 'am', t);
    p.trashOutBid.approvedAt = t;
    p.actioned.push({ id: newId('ac', 'AC-'), kind: 'trashout', label: 'Triple R trash-out bid', party: 'tripleR', actionedAt: t, completedAt: null });
    const a = track(p, { ruleId: 'A-05', party: 'tripleR', templateId: 'TR-BID-01', subject: o.subject, body: o.body }, t);
    agentNote(p, at.agentId, hit.ruleId, 'approve', `Triple R bid ${fmtMoney(p.trashOutBid.amount)} approved by ${SAMPLE.user.name} · template TR-BID-01${at.suffix}`, t);
    return { ok: true, items: [a] };
  },

  agreeValue(propertyId, o = {}) {
    const t = clock.today(), p = findProperty(propertyId), hit = p && activeHit(p, ['A-04', 'EX-10'], t);
    if (!hit) return handled(`A-04/EX-10#${propertyId}`);
    if (!o.reviewed) return { ok: false, reason: 'Confirm you reviewed the values and comps' };
    if (o.value != null && o.value !== '' && !wholeDollars(o.value)) return { ok: false, reason: 'Enter a whole-dollar value above 0' };
    const at = attribution(p, hit, 'cmp', t);
    p.valueAgreedAt = t;
    p.agreedValue = o.value ? Number(o.value) : round100((p.bpoValue + p.botValue) / 2);
    p.listPrice = round100(p.agreedValue * 1.03); p.reserve = round100(p.listPrice * 0.9);
    const edited = !!o.value && Number(o.value) !== round100((p.bpoValue + p.botValue) / 2);
    agentNote(p, at.agentId, hit.ruleId, edited ? 'edit' : 'approve', `Value agreed at ${fmtMoney(p.agreedValue)} by ${SAMPLE.user.name}${at.suffix}`, t);
    return { ok: true };
  },

  listProperty(propertyId, o = {}) {
    const t = clock.today(), p = findProperty(propertyId), hit = p && activeHit(p, ['A-07'], t);
    if (!hit || hit.needsApproval) return handled(`A-07#${propertyId}`);
    if (o.listPrice != null && !wholeDollars(o.listPrice)) return { ok: false, reason: 'Enter a whole-dollar list price above 0' };
    const rb = reserveBid(o, o.listPrice ? Number(o.listPrice) : p.listPrice); if (rb.error) return { ok: false, reason: rb.error };
    const at = attribution(p, hit, hit.agent || 'cmp', t);
    const edited = (!!o.listPrice && Number(o.listPrice) !== p.listPrice) || reserveEdited(p, hit, rb, t);
    if (o.listPrice) { p.listPrice = Number(o.listPrice); p.reserve = round100(p.listPrice * 0.9); }
    if (rb.reserve != null) p.reserve = rb.reserve;
    if (rb.startingBid != null) p.startingBid = rb.startingBid;
    p.listedAt = t; p.brokerChecks = []; p.hubzu = p.hubzu || { views: 0, watchers: 0, showings: 0 };
    const a = track(p, { ruleId: 'A-07', party: 'broker', templateId: 'BRK-LIST-01', subject: o.subject, body: o.body }, t);
    agentNote(p, at.agentId, hit.ruleId, edited ? 'edit' : 'approve', `Pushed to market at ${fmtMoney(p.listPrice)} by ${SAMPLE.user.name} · template BRK-LIST-01${at.suffix}`, t);
    return { ok: true, items: [a] };
  },

  sendInitialListRequest(propertyId, o = {}) {
    const t = clock.today(), p = findProperty(propertyId), hit = p && activeHit(p, ['A-07'], t);
    if (!hit || !hit.needsApproval) return handled(`A-07#${propertyId}`);
    const amount = o.amount != null ? Number(o.amount) : p.listPrice;
    if (!wholeDollars(amount)) return { ok: false, reason: 'Enter a whole-dollar list price above 0' };
    const rb = reserveBid(o, amount); if (rb.error) return { ok: false, reason: rb.error };
    const at = attribution(p, hit, hit.agent || 'cmp', t);
    const edited = amount !== p.listPrice || reserveEdited(p, hit, rb, t);
    if (rb.reserve != null) p.reserve = rb.reserve;
    if (rb.startingBid != null) p.startingBid = rb.startingBid;
    const q = addRequest(p, 'initial', { amount }, t);
    const a = track(p, { ruleId: 'A-07', party: 'investor', templateId: 'INV-INITIAL-01', requestId: q.id, subject: o.subject, body: o.body }, t);
    agentNote(p, at.agentId, hit.ruleId, edited ? 'edit' : 'approve', `Initial list request (${fmtMoney(amount)}) sent to ${p.investor} by ${SAMPLE.user.name} · template INV-INITIAL-01${at.suffix}`, t);
    return { ok: true, requestId: q.id, items: [a] };
  },

  requestReduction(propertyId, o = {}) {
    const t = clock.today(), p = findProperty(propertyId), hit = p && activeHit(p, ['EX-12', 'A-03'], t);
    if (!hit) return handled(`EX-12/A-03#${propertyId}`);
    const price = o.price != null ? Number(o.price) : (p.reductionReview ? p.reductionReview.recommendedPrice : round100(p.listPrice * (1 - SAMPLE.sla.defaultReductionPct / 100)));
    if (!wholeDollars(price) || price >= p.listPrice) return { ok: false, reason: 'Reduction price must be a whole-dollar amount below the current list price' };
    const at = attribution(p, hit, 'rmp', t);
    const recPrice = at.res && at.res.decision.values ? at.res.decision.values.price : null;
    const edited = recPrice != null && price !== recPrice;
    p.reductionReview = p.reductionReview || { at: t, outcome: 'reduce', pct: SAMPLE.sla.defaultReductionPct, recommendedPrice: price, requestedAt: null };
    p.reductionReview.requestedAt = t;
    const q = addRequest(p, 'reduction', { amount: price }, t);
    const a = track(p, { ruleId: hit.ruleId, party: 'investor', templateId: 'INV-REDUCTION-01', requestId: q.id, subject: o.subject, body: o.body }, t);
    agentNote(p, at.agentId, hit.ruleId, edited ? 'edit' : 'approve', `Reduction request to ${fmtMoney(price)} sent to ${p.investor} by ${SAMPLE.user.name} · template INV-REDUCTION-01${at.suffix}`, t);
    return { ok: true, requestId: q.id, items: [a] };
  },

  /** decideOffer(id, {action:'accept'|'counter'|'hb'|'reject', amount, requireApproval}) -> route 'authority' | 'investor' | 'none'
      requireApproval: the drawer's amber warning (below recommendation or reserve) forces the investor route. */
  decideOffer(propertyId, o = {}) {
    const t = clock.today(), p = findProperty(propertyId), hit = p && activeHit(p, ['A-02', 'EX-14'], t);
    if (!hit) return handled(`A-02/EX-14#${propertyId}`);
    const action = o.action || (p.recommendation && p.recommendation.action) || 'counter';
    const best = bestLive(p), und = Rx.undecided(p), rec = p.recommendation;
    const at = attribution(p, hit, agentsForRule(hit.ruleId, p)[0], t);
    if (action === 'hb' || action === 'reject') {
      und.forEach(x => { x.decidedAt = t; if (action === 'reject') x.status = 'rejected'; });
      agentNote(p, at.agentId, hit.ruleId, action === 'reject' ? 'reject' : (rec && rec.action === 'hb' ? 'approve' : 'edit'), (action === 'hb' ? `Highest & Best called by ${SAMPLE.user.name}` : `Offers rejected by ${SAMPLE.user.name}`) + at.suffix, t);
      return { ok: true, route: 'none' };
    }
    const amount = Number(o.amount != null ? o.amount : (action === 'accept' ? best.amount : p.recommendation.amount));
    if (!wholeDollars(amount) || amount > 2 * p.listPrice) return { ok: false, reason: 'Amount must be whole dollars, above 0 and at most 2x list price' };
    const within = !o.requireApproval && action === 'accept' && amount >= p.listPrice * SAMPLE.sla.delegatedAcceptPctOfList / 100 && amount >= p.reserve && ['Cash', 'Conventional'].includes(best.financing);
    const decision = rec && rec.action === action && (rec.amount == null || rec.amount === amount) ? 'approve' : 'edit';
    und.forEach(x => { x.decidedAt = t; });
    if (within) {
      best.status = 'accepted'; p.contractAt = t;
      const a = track(p, { ruleId: hit.ruleId, party: 'broker', templateId: 'BRK-ACCEPT-01', subject: o.subject, body: o.body }, t);
      agentNote(p, at.agentId, hit.ruleId, decision, `Offer ${fmtMoney(amount)} accepted within authority by ${SAMPLE.user.name} · template BRK-ACCEPT-01${at.suffix}`, t);
      return { ok: true, route: 'authority', items: [a] };
    }
    const q = addRequest(p, action === 'counter' ? 'counter' : 'offer', { action, amount }, t);
    const a = track(p, { ruleId: hit.ruleId, party: 'investor', templateId: 'INV-OFFER-01', requestId: q.id, subject: o.subject, body: o.body }, t);
    agentNote(p, at.agentId, hit.ruleId, decision, `${action === 'counter' ? 'Counter' : 'Acceptance'} at ${fmtMoney(amount)} sent to ${p.investor} for approval by ${SAMPLE.user.name} · template INV-OFFER-01${at.suffix}`, t);
    return { ok: true, route: 'investor', requestId: q.id, status: 'With investor', items: [a] };
  },

  executeApproved(propertyId, o = {}) {
    const t = clock.today(), p = findProperty(propertyId), hit = p && activeHit(p, ['A-01', 'EX-15'], t);
    if (!hit) return handled(`A-01/EX-15#${propertyId}`);
    const ap = p.approvals.find(x => x.id === hit.approvalId), best = bestLive(p);
    const at = attribution(p, hit, 'offer', t);
    ap.executedAt = t;
    if (ap.action === 'accept') { if (best) best.status = 'accepted'; p.contractAt = t; }
    else if (best) { best.status = 'countered'; }
    const a = track(p, { ruleId: hit.ruleId, party: 'broker', templateId: 'BRK-EXECUTE-01', subject: o.subject, body: o.body }, t);
    agentNote(p, at.agentId, hit.ruleId, 'approve', `${ap.action === 'accept' ? 'Acceptance' : 'Counter'} at ${fmtMoney(ap.amount)} executed by ${SAMPLE.user.name} · template BRK-EXECUTE-01${at.suffix}`, t);
    return { ok: true, items: [a] };
  },

  /** logResponse(awaitingId | requestId, outcome, note)
      Vendor outcomes: 'Completed' | 'Update received'; occupancy (EX-02) items: 'Occupied' | 'Vacant' | 'Update received'. Investor outcomes: 'Approved' | 'Declined' | 'Requested more info'. */
  logResponse(id, outcome, note = '') {
    const t = clock.today();
    if (String(note).length > 500) return { ok: false, reason: 'Keep the note under 500 characters' };
    let a = null, p = null, q = null;
    if (String(id).startsWith('AW-')) {
      a = DB.awaiting.find(x => x.id === id);
      if (!a || a.status !== 'open') return handled(id);
      p = findProperty(a.propertyId);
      if (a.requestId) q = p.investorRequests.find(x => x.id === a.requestId);
    } else {
      for (const x of DB.properties) { const f = x.investorRequests.find(r => r.id === id); if (f) { p = x; q = f; break; } }
    }
    if (!p) return handled(id);
    const noteText = note ? ` · note: ${note}` : '';
    if (q) {
      if (q.status !== 'open') return handled(id);
      if (!['Approved', 'Declined', 'Requested more info'].includes(outcome)) return { ok: false, reason: 'Choose Approved, Declined or Requested more info' };
      if (outcome === 'Approved') {
        q.status = 'approved'; q.respondedAt = t;
        if (q.type === 'offer' || q.type === 'counter') p.approvals.push({ id: newId('ap', 'AP-'), requestId: q.id, action: q.action === 'accept' || (q.type === 'offer' && !q.action) ? 'accept' : 'counter', amount: q.amount, approvedAt: t, executedAt: null });
        else if (q.type === 'reduction') { p.priceChanges.push({ at: t, from: p.listPrice, to: q.amount }); p.listPrice = q.amount; p.reserve = round100(q.amount * 0.9); }
        else if (q.type === 'initial') { p.listPrice = q.amount || p.listPrice; p.listedAt = t; p.brokerChecks = []; p.hubzu = p.hubzu || { views: 0, watchers: 0, showings: 0 }; }
      } else if (outcome === 'Declined') {
        q.status = 'declined'; q.respondedAt = t;
        if (q.type === 'offer' || q.type === 'counter') Rx.live(p).forEach(x => { if (x.status === 'live') x.decidedAt = null; });
        if (q.type === 'reduction' && p.reductionReview) p.reductionReview.requestedAt = null;
      } else { q.infoRequestedAt = t; }
      DB.awaiting.forEach(x => { if (x.requestId === q.id && x.status === 'open' && outcome !== 'Requested more info') { x.status = 'responded'; x.respondedAt = t; x.outcome = outcome; } });
      audit(p, `Investor response logged by ${SAMPLE.user.name}: ${outcome} (${SAMPLE.requestTypes[q.type]})${noteText}`, t);
      return { ok: true, outcome, requestId: q.id };
    }
    const occupancy = a.ruleId === 'EX-02';   // occupancy follow-up: the response is the result itself
    if (occupancy && (outcome === 'Occupied' || outcome === 'Vacant')) {
      if (!p.occupancyResult) { p.occupancyResult = outcome; p.occupancyResultAt = t; }
      a.status = 'responded'; a.respondedAt = t; a.outcome = outcome;
    }
    else if (outcome === 'Completed' && !occupancy) { completeMilestone(p, a.ruleId, t); a.status = 'responded'; a.respondedAt = t; a.outcome = outcome; }
    else if (outcome === 'Update received') { updateMilestone(p, a.ruleId, t); a.expectedBy = addDays(a.expectedBy, SAMPLE.sla.vendorResponseDays); }
    else return { ok: false, reason: occupancy ? 'Choose Occupied, Vacant or Update received' : 'Choose Completed or Update received' };
    audit(p, `Response logged by ${SAMPLE.user.name}: ${outcome} (${a.templateName})${noteText}`, t);
    return { ok: true, outcome, awaitingId: a.id };
  },

  completeChecklist(propertyId) {
    const t = clock.today(), p = findProperty(propertyId), hit = p && activeHit(p, ['EX-01'], t);
    if (!hit) return handled(`EX-01#${propertyId}`);
    if (!p.brokerAssigned) p.brokerAssigned = t;
    if (!p.equatorSetup) p.equatorSetup = t;
    if (!p.occupancyOrderedAt) p.occupancyOrderedAt = t;
    audit(p, `Intake checklist completed by ${SAMPLE.user.name}`, t);
    return { ok: true };
  },

  snooze(hitRef, reason, note = '') {
    const t = clock.today(), p = findProperty(hitRef.propertyId), hit = p && activeHit(p, [hitRef.ruleId], t);
    if (!hit) return handled(`${hitRef.ruleId}#${hitRef.propertyId}`);
    if (!SAMPLE.snoozeReasons.includes(reason)) return { ok: false, reason: 'Choose a snooze reason' };
    if (String(note).length > 500) return { ok: false, reason: 'Keep the note under 500 characters' };
    p.snoozes.push({ ruleId: hit.ruleId, until: addDays(t, 1), reason, note, at: t });
    audit(p, `${hit.title} snoozed 1 day by ${SAMPLE.user.name}: ${reason}${note ? ' · note: ' + note : ''}`, t);
    return { ok: true };
  },

  logCheck(propertyId, ruleId = 'C-04') {
    const t = clock.today(), p = findProperty(propertyId), hit = p && activeHit(p, [ruleId], t);
    if (!hit || hit.kind !== 'checkin') return handled(`${ruleId}#${propertyId}`);
    if (ruleId === 'C-01') p.evictionCheckins.push(t);
    else if (ruleId === 'C-02') p.tripleRUpdates.push(t);
    else if (ruleId === 'C-03') p.valuesUpdatedAt = t;
    else p.brokerChecks.push(t);
    audit(p, `${hit.title} logged by ${SAMPLE.user.name}, no email`, t);
    return { ok: true };
  },

  /** reviewAgent(propertyId, agentId, ruleId, { decision: 'approve'|'edit'|'reject', values, reason, note }) -> { ok }
      Your decision on an agent result. A newer decision on the same day supersedes the older one
      (agentResult reads the latest). srp edits need whole dollars with reserve <= list and starting bid <= reserve. */
  reviewAgent(propertyId, agentId, ruleId, o = {}) {
    const t = clock.today(), p = findProperty(propertyId), hit = p && activeHit(p, [ruleId], t);
    if (!hit || !agentsForRule(ruleId, p).includes(agentId)) return handled(`${agentId}:${ruleId}#${propertyId}`);
    const decision = o.decision;
    if (!['approve', 'edit', 'reject'].includes(decision)) return { ok: false, reason: 'Choose approve, edit or reject' };
    if (o.note != null && String(o.note).length > 500) return { ok: false, reason: 'Keep the note under 500 characters' };
    const values = decision === 'edit' ? Object.assign({}, o.values) : null;
    if (decision === 'edit' && agentId === 'srp') {
      const r = Number(values.reserve), b = Number(values.startingBid);
      if (!wholeDollars(r) || !wholeDollars(b)) return { ok: false, reason: 'Enter whole-dollar amounts above 0' };
      if (r > p.listPrice) return { ok: false, reason: 'Reserve must be at most the list price' };
      if (b > r) return { ok: false, reason: 'Starting bid must be at most the reserve' };
      values.reserve = r; values.startingBid = b;
    }
    if (decision === 'reject' && !SAMPLE.agentRejectReasons.includes(o.reason)) return { ok: false, reason: 'Choose a reason' };
    const res = agentResult(agentId, p, t, hit);
    const reason = decision === 'reject' ? o.reason : null, note = o.note ? String(o.note) : '';
    p.agentDecisions.push({ agentId, ruleId, decision, values, reason, note, at: t, by: SAMPLE.user.name });
    const verb = { approve: 'approved', edit: 'edited', reject: 'rejected' }[decision];
    const what = values ? Object.keys(values).map(k => `${k} ${typeof values[k] === 'number' ? fmtMoney(values[k]) : values[k]}`).join(', ') : res.decision.summary;
    agentNote(p, agentId, ruleId, decision, `${agentName(agentId)} recommendation ${verb} by ${SAMPLE.user.name} · ${what} · guideline ${res.guideline.id}${reason ? ' · reason: ' + reason : ''}${note ? ' · note: ' + note : ''}`, t);
    return { ok: true };
  },

  /** runAgents(t, { overnight }): each agent prepares its result for every active hit it works on, once per
      hit (key agent|property|rule|followupNo|requestId). Writes DB.agentLog runs and kind 'agent' timeline entries. */
  runAgents(t, o = {}) {
    t = t || clock.today();
    const seen = new Set(DB.agentLog.filter(e => e.kind === 'run').map(e => e.key));
    let runs = 0;
    selectors.hits(null, t).forEach(({ p, hit }) => agentsForRule(hit.ruleId, p).forEach(agentId => {
      const key = `${agentId}|${p.id}|${hit.ruleId}|${hit.followupNo}|${hit.requestId || ''}`;
      if (seen.has(key)) return;
      seen.add(key); runs++;
      const res = agentResult(agentId, p, t, hit);
      const text = `${agentName(agentId)}: ${res.decision.summary} · guideline ${res.guideline.id} · confidence ${res.confidence.level}`;
      DB.agentLog.push({ at: t, kind: 'run', overnight: !!o.overnight, agentId, propertyId: p.id, ruleId: hit.ruleId, key, text });
      p.timeline.push({ at: t, source: agentName(agentId), kind: 'agent', text });
    }));
    return { ok: true, runs };
  },

  /** rerunAgent(propertyId, agentId): runs the agent again on the file's first hit it works on (always logged). */
  rerunAgent(propertyId, agentId) {
    const t = clock.today(), p = findProperty(propertyId);
    const hit = p && derive(p, t).hits.find(h => agentsForRule(h.ruleId, p).includes(agentId));
    if (!hit) return handled(`rerun ${agentId}#${propertyId}`);
    const res = agentResult(agentId, p, t, hit);
    const key = `${agentId}|${p.id}|${hit.ruleId}|${hit.followupNo}|${hit.requestId || ''}|rerun|${DB.agentLog.length}`;
    const text = `${agentName(agentId)}: Re-run on request · ${res.decision.summary} · guideline ${res.guideline.id} · confidence ${res.confidence.level}`;
    DB.agentLog.push({ at: t, kind: 'run', overnight: false, agentId, propertyId: p.id, ruleId: hit.ruleId, key, text });
    p.timeline.push({ at: t, source: agentName(agentId), kind: 'agent', text });
    return { ok: true };
  }
};

/** buildFreshDB(): builds the sample DB from SAMPLE and runs the agents overnight (the 7:00 AM check).
    It sets DB (runAgents writes to it) and returns it. makeDB() and the guided demo (section 12) both use it. */
function buildFreshDB() { DB = buildDatabase(SAMPLE, SAMPLE.meta.seed); actions.runAgents(AS_OF, { overnight: true }); return DB; }
function makeDB() { return buildFreshDB(); }
makeDB();

/* =====================================================================
   8. SCREENS: SCREENS.<name>(root, params, query)
      S1 Command Center, S2 My Portfolio, S3 Property detail, S4 Offers

function groupPartyLabel(rule, xs) {

/* ---------------------------------------------------------------------
   S6 helpers: Log response modal and Resend
   --------------------------------------------------------------------- */
// id: an Awaiting item ('AW-...') or an investor request ('IR-...', from the Investor follow-ups page)
function openLogResponse(id) {
  let a = null, p = null, q = null;
  if (String(id).startsWith('IR-')) DB.properties.some(x => { const f = x.investorRequests.find(r => r.id === id); if (f) { p = x; q = f; } return !!f; });
  else { a = DB.awaiting.find(x => x.id === id); p = a && findProperty(a.propertyId); }
  if ((q && q.status !== 'open') || (!q && (!a || a.status !== 'open'))) { console.info('Already handled:', id); toast('Already handled'); refresh(); return; }
  const investor = !!q || !!a.requestId;
  const opts = investor ? [['Approved', 'Approved'], ['Declined', 'Declined'], ['Requested more info', 'Requested more info']]
    : a.ruleId === 'EX-02' ? [['Occupied', 'Result: Occupied (route to ESD eviction)'], ['Vacant', 'Result: Vacant (route to Triple R and AFS)'], ['Update received', 'Update received, no result yet']]
    : [['Completed', 'Completed'], ['Update received', 'Update received, not complete']];
  const what = q ? `${SAMPLE.requestTypes[q.type]} request${q.amount ? ` at ${fmtMoney(q.amount)}` : ''} · ${p.street} · submitted ${fmtMD(q.submittedAt)} to ${p.investor}`
    : `${a.templateName} · ${p ? p.street : ''} · sent ${fmtMD(a.sentAt)} to ${partyInfo(p, a.party === 'item' ? 'tripleR' : a.party).label}`;
  openModal({
    title: 'Log response', size: 'sm',
    body: `<div class="small muted mb16">${esc(what)}</div>
      ${opts.map(([v, l]) => `<label class="checkbox mb8"><input type="radio" name="lr-outcome" value="${esc(v)}"> ${esc(l)}</label>`).join('<br>')}
      <div class="rv-field mt12"><label for="lr-note">Note (optional, up to 500 characters)</label><textarea class="input" id="lr-note" rows="4"></textarea><div class="xs muted right" id="lr-count">0 / 500</div></div>`,
    footer: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="lr-save" disabled>Save</button>',
    onMount(m, close) {
      const upd = () => {
        const n = $('#lr-note', m).value.length, over = n > 500, c = $('#lr-count', m);
        c.textContent = `${n} / 500`; c.classList.toggle('bad', over);
        $('#lr-save', m).disabled = over || !$('input[name=lr-outcome]:checked', m);
      };
      m.addEventListener('input', upd); m.addEventListener('change', upd);
      $('#lr-save', m).addEventListener('click', () => {
        const sel = $('input[name=lr-outcome]:checked', m); if (!sel) return;
        const outcome = sel.value, res = actions.logResponse(id, outcome, $('#lr-note', m).value);
        close();
        if (!res.ok) { toast(res.reason === 'Already handled' ? 'Already handled' : res.reason); refresh(); return; }
        toast(`Response logged: ${outcome} · ${p.street} (simulated).`);
        fadeAndRefresh([], outcome === 'Update received' || outcome === 'Requested more info' ? null : `.aw-${id}, .ir-${id}`);
      });
    }
  });
}
function resendAwaiting(id) {
  const a = DB.awaiting.find(x => x.id === id), p = a && findProperty(a.propertyId);
  if (!a || !p) { toast('Already handled'); return; }
  if (derive(p).hits.some(h => h.ruleId === a.ruleId)) { openReview({ ruleId: a.ruleId, propertyIds: [p.id] }); return; }
  toast(`Sent ${fmtMD(a.sentAt)}. If there is no response by ${fmtMD(a.expectedBy)}, the file comes back on the Command Center to resend.`);
}

/* ---------------------------------------------------------------------
   S2 MY PORTFOLIO (#/portfolio): every file with its stage, SLA status
   and next action. Filters (stage, sla, q, occ, inv) live in the hash,
   e.g. #/portfolio?stage=preservation&sla=overdue. Unknown values are
   ignored (treated as All). Default sort: SLA priority, then days in gap.
   --------------------------------------------------------------------- */
const SLA_FILTERS = [['all', 'All'], ['overdue', 'Overdue'], ['today', 'Action today'], ['ready', 'Ready'], ['due', 'Check-in due'], ['waiting', 'Waiting'], ['ontrack', 'On track']];
const SLA_RANK = { overdue: 0, today: 1, ready: 2, due: 3, waiting: 4, ontrack: 5, error: 6 };
const OCC_FILTERS = [['occupied', 'Occupied'], ['vacant', 'Vacant'], ['pending', 'Result pending']];
const occOf = p => (p.occupancyResult === 'Occupied' ? 'occupied' : p.occupancyResult === 'Vacant' ? 'vacant' : 'pending');
const occLabel = p => OCC_FILTERS.find(o => o[0] === occOf(p))[1];
const pfView = { focusSearch: false, caret: 0 };   // keeps the search box focused while its text filters the table

function portfolioFilters(query) {
  const g = k => (query && query.get(k)) || '';
  return {
    stage: STAGE_KEYS.includes(g('stage')) ? g('stage') : '',
    sla: SLA_FILTERS.some(s => s[0] !== 'all' && s[0] === g('sla')) ? g('sla') : '',
    q: g('q').slice(0, 100),
    occ: OCC_FILTERS.some(o => o[0] === g('occ')) ? g('occ') : '',
    inv: SAMPLE.investors.some(i => i.name === g('inv')) ? g('inv') : ''
  };
}
function portfolioHash(f, over) {
  const x = Object.assign({}, f, over || {}), sp = new URLSearchParams();
  ['stage', 'sla', 'q', 'occ', 'inv'].forEach(k => { if (x[k]) sp.set(k, x[k]); });
  const s = sp.toString();
  return '#/portfolio' + (s ? '?' + s : '');
}
const gapDays = d => (d.sla === 'overdue' ? Math.max(...d.hits.filter(h => h.kind === 'exception').map(h => h.daysInGap)) : d.daysInStage);
const valueShown = p => p.agreedValue || reconciled(p);
function agentCell(d) {
  const na = d.nextAction, hit = na.ruleId ? d.hits.find(h => h.ruleId === na.ruleId) : null;
  return hit ? { hit, name: agentName(hit.agent), draft: !!hit.template && hit.ruleId !== 'EX-01' } : { hit: null, name: '' };
}

function renderPortfolio(root, query) {
  const t = clock.today(), f = portfolioFilters(query), needle = f.q.trim().toLowerCase();
  const base = selectors.all(t).filter(({ p }) => (!needle || `${p.street} ${p.city} ${p.zip} ${p.loan}`.toLowerCase().includes(needle))
    && (!f.occ || occOf(p) === f.occ) && (!f.inv || p.investor === f.inv));
  const rows = base.filter(x => (!f.stage || x.d.stage === f.stage) && (!f.sla || x.d.sla === f.sla))
    .map(x => Object.assign(x, { rank: SLA_RANK[x.d.sla], gap: gapDays(x.d) }))
    .sort((a, b) => (a.rank - b.rank) || (b.gap - a.gap));
  const forStrip = base.filter(x => !f.sla || x.d.sla === f.sla), forPills = base.filter(x => !f.stage || x.d.stage === f.stage);

  // Lifecycle strip from the Command Center, used as a single-select stage filter (click the active tile to clear)
  const strip = `<nav class="strip ${f.stage ? 'has-on' : ''}" id="pf-strip" aria-label="Filter by lifecycle stage">${SAMPLE.stages.map(s => {
    const inStage = forStrip.filter(x => x.d.stage === s.key), on = f.stage === s.key, exc = inStage.filter(x => x.d.sla === 'overdue').length;
    return `<a class="strip-tile ${on ? 'on' : ''}" href="${esc(portfolioHash(f, { stage: on ? '' : s.key }))}" style="--c:${s.color}" data-stage="${esc(s.key)}" aria-pressed="${on}" title="${esc(on ? 'Click again to show every stage' : `Show ${s.label} files`)}">
      <div class="st-l">${esc(s.label)}</div><div class="st-n">${inStage.length}</div><div class="st-b">${exc ? `<span class="pill pill-bad st-pill">${exc} exc</span>` : ''}</div></a>`;
  }).join('')}</nav>`;
  const pills = `<div class="sla-pills" id="pf-sla" aria-label="Filter by SLA status">${SLA_FILTERS.map(([k, l]) => {
    const n = k === 'all' ? forPills.length : forPills.filter(x => x.d.sla === k).length, on = (f.sla || 'all') === k;
    return `<a class="sla-pill ${on ? 'on' : ''}" data-sla="${k}" href="${esc(portfolioHash(f, { sla: k === 'all' ? '' : k }))}">${esc(l)} <b>${n}</b></a>`;
  }).join('')}</div>`;
  const bar = `<div class="pf-bar"><div class="input-icon pf-search">${I('search', 15)}<input class="input" id="pf-q" maxlength="100" placeholder="Search address, city, ZIP or loan" value="${esc(f.q)}" aria-label="Search the portfolio" autocomplete="off"></div>
    <select class="select" id="pf-occ" aria-label="Occupancy"><option value="">All occupancy</option>${OCC_FILTERS.map(([k, l]) => `<option value="${k}" ${f.occ === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
    <select class="select" id="pf-inv" aria-label="Investor"><option value="">All investors</option>${SAMPLE.investors.map(i => `<option value="${esc(i.name)}" ${f.inv === i.name ? 'selected' : ''}>${esc(i.name)}</option>`).join('')}</select>
    <span class="spacer"></span>${pills}</div>`;
  const chips = [];
  if (f.stage) chips.push(['stage', `Stage: ${stageInfo(f.stage).label}`]);
  if (f.sla) chips.push(['sla', `SLA: ${SLA_FILTERS.find(s => s[0] === f.sla)[1]}`]);
  if (f.q.trim()) chips.push(['q', `Search: "${f.q.trim()}"`]);
  if (f.occ) chips.push(['occ', `Occupancy: ${OCC_FILTERS.find(o => o[0] === f.occ)[1]}`]);
  if (f.inv) chips.push(['inv', `Investor: ${f.inv}`]);
  const chipHtml = chips.length ? `<div class="filter-chips" id="pf-chips">${chips.map(([k, l]) => `<span class="chip chip-blue filter-chip">${esc(l)}<a href="${esc(portfolioHash(f, { [k]: '' }))}" aria-label="Remove filter">\u00d7</a></span>`).join('')}<a class="small b" href="#/portfolio" id="pf-clear">Clear all</a></div>` : '';

  root.innerHTML = pageHead('My Portfolio', `${rows.length} of ${DB.properties.length} files · sorted by SLA priority, then most days in gap`)
    + strip + `<section class="card">${bar}${chipHtml}<div id="pf-table"></div></section>`;
  mountTable($('#pf-table', root), {
    rows, pageSize: 25, draggable: false, rowClass: () => 'pf-row',
    empty: 'No files match these filters. <a href="#/portfolio">Clear all</a>',
    columns: [
      { key: 'property', label: 'Property', value: r => r.p.street, render: r => `<a class="addr" href="#/property/${r.p.id}">${esc(r.p.street)}</a><div class="sub2">${esc(`${titleCase(r.p.city)}, ${r.p.state} · Loan ${r.p.loan}`)}</div>` },
      { key: 'stage', label: 'Stage', value: r => STAGE_KEYS.indexOf(r.d.stage), render: r => stageTrack(r.p, r.d) },
      { key: 'days', label: 'Days in stage', align: 'right', value: r => r.d.daysInStage, render: r => `<b>${esc(r.d.daysInStage)}</b>` },
      { key: 'sla', label: 'SLA status', value: r => r.rank * 1000 - r.gap, render: r => slaChip(r.p, r.d) },
      { key: 'next', label: 'Next action', sortable: false, render: r => nextAction(r.p, r.d) },
      { key: 'agent', label: 'Agent', value: r => agentCell(r.d).name, render: r => { const a = agentCell(r.d); return a.hit ? `<span class="row nowrap">${a.draft ? '<span class="dot" style="background:var(--good)" title="Draft ready to review"></span>' : ''}<span class="small">${esc(a.name)}</span></span>` : '\u2014'; } },
      { key: 'investor', label: 'Investor', value: r => r.p.investor, render: r => esc(r.p.investor) },
      { key: 'occ', label: 'Occupancy', value: r => occLabel(r.p), render: r => esc(occLabel(r.p)) },
      { key: 'value', label: 'Value / List', align: 'right', value: r => r.p.listPrice || valueShown(r.p) || 0, render: r => `<div>${esc(fmtMoney(valueShown(r.p)))}</div><div class="sub2">List ${esc(fmtMoney(r.p.listPrice))}</div>` }
    ]
  });
  const qIn = $('#pf-q', root);
  qIn.addEventListener('input', () => { pfView.focusSearch = true; pfView.caret = qIn.selectionStart; replaceQuery(portfolioHash(f, { q: qIn.value.slice(0, 100) })); });
  if (pfView.focusSearch) { pfView.focusSearch = false; qIn.focus(); const c = Math.min(pfView.caret, qIn.value.length); qIn.setSelectionRange(c, c); }
  $('#pf-occ', root).addEventListener('change', e => replaceQuery(portfolioHash(f, { occ: e.target.value })));
  $('#pf-inv', root).addEventListener('change', e => replaceQuery(portfolioHash(f, { inv: e.target.value })));
}

/* ---------------------------------------------------------------------
   S3 PROPERTY DETAIL (#/property/:id): one scrolling page. Header card,
   lifecycle stepper (occupied detour), open issues + timeline (8/12),
   next action card + key facts (4/12).
   --------------------------------------------------------------------- */
const latest = (...ds) => ds.filter(Boolean).sort((a, b) => b - a)[0] || null;
const domOf = (p, t) => (p.listedAt ? dayDiff(p.listedAt, t) : null);
function kindChip(h) {
  if (h.kind === 'exception') return `<span class="chip ${h.severity === 'critical' ? 'chip-red-o' : 'chip-amber-o'}">Exception</span>`;
  if (h.ruleId === 'A-01') return '<span class="chip sla-today">Action today</span>';
  if (h.kind === 'actionable') return '<span class="chip chip-green-o">Ready to advance</span>';
  return '<span class="chip chip-grey">Check-in</span>';
}
function stepperHtml(p, d, t) {
  const idx = STAGE_KEYS.indexOf(d.stage), occupied = p.occupancyResult === 'Occupied', S = SAMPLE.sla;
  const targets = { intake: S.intakeDays, occupancy: S.occupancyResultDays, preservation: S.trashOutDays, listing: S.listAfterValueDays, market: S.reductionNeededDom };
  const entries = SAMPLE.stages.map((s, i) => (i <= idx && !(s.key === 'eviction' && !occupied) ? stageEntered(p, s.key) : null));
  return `<div class="stepper" id="pd-stepper" role="list" aria-label="Lifecycle stages">${SAMPLE.stages.map((s, i) => {
    const evict = s.key === 'eviction', state = evict && !occupied ? 'skip' : i < idx ? 'done' : i === idx ? 'cur' : 'todo';
    let line;
    if (state === 'skip') line = p.occupancyResult === 'Vacant' ? 'Not needed: vacant' : 'Only if occupied';
    else if (state === 'cur') {
      const ck = stageClock(p, s.key, t);
      line = ck.target ? `<span class="${ck.day > ck.target ? 's-over' : ''}">day ${esc(ck.day)} of ${esc(ck.target)}</span>` : `day ${esc(d.daysInStage)}`;
    } else if (state === 'done') {
      const next = entries.slice(i + 1).find(Boolean) || t;
      line = entries[i] ? esc(nDays(dayDiff(entries[i], next))) : 'Done';
    } else line = targets[s.key] ? `target ${esc(nDays(targets[s.key]))}` : '\u00a0';
    const at = entries[i];
    const tip = evict ? 'Occupied detour: Occupancy check, then Eviction (ESD), then Preservation' : s.label;
    return `<div class="step ${state} ${evict ? 'detour' : ''}" role="listitem" style="--c:${s.color}" data-step="${esc(s.key)}" title="${esc(tip)}">
      <div class="s-l">${esc(s.label)}</div><div class="muted">${at ? `entered ${esc(fmtMD(at))}` : '\u00a0'}</div><div>${line}</div></div>`;
  }).join('')}</div>`;
}
// Two or three lines: what the agent prepared and why (Next action card)
function agentSummary(p, d, hit) {
  if (!hit) return d.nextAction.kind === 'waiting' ? 'A message is out and its response clock is running. The file comes back to the Command Center if nobody replies in time.'
    : 'The Asset Management Agent is watching this file. It comes back to the Command Center when a clock runs out or a decision is needed.';
  const rec = p.recommendation, rr = p.reductionReview, tpl = hit.template ? tplById(hit.template) : null;
  switch (hit.ruleId) {
    case 'A-02': case 'EX-14': if (rec) return `${agentName(rec.agent)}: ${rec.summary}. ${rec.routeText}. ${rec.bullets[0]}.`; break;
    case 'A-01': case 'EX-15': {
      const ap = p.approvals.find(a => a.id === hit.approvalId) || {};
      return `${p.investor} approved the ${ap.action === 'accept' ? 'acceptance' : 'counter'} at ${fmtMoney(ap.amount)} on ${fmtMD(ap.approvedAt)}. The Offer Acceptance Agent drafted the message to ${p.broker}.`;
    }
    case 'A-03': case 'EX-12': {
      const pctR = rr ? rr.pct : SAMPLE.sla.defaultReductionPct, price = rr ? rr.recommendedPrice : round100(p.listPrice * (1 - pctR / 100));
      return `Review Marketing Plan Agent recommends a ${pctR}% reduction from ${fmtMoney(p.listPrice)} to ${fmtMoney(price)}. ${hit.reason}.`;
    }
    case 'A-04': case 'EX-10': return `BPO ${fmtMoney(p.bpoValue)}, bot-reviewed ${fmtMoney(p.botValue)}, reconciled ${fmtMoney(reconciled(p))}. Review the values and comps, then agree the value.`;
    default: break;
  }
  return `${agentName(hit.agent)} ${tpl ? `drafted "${tpl.name}" (${tpl.id}) to ${hit.partyLabel}` : 'prepared the checklist'}. ${hit.reason}.`;
}
function vendorRows(p) {
  const occ = p.occupancyResult === 'Occupied', bid = p.trashOutBid;
  return [
    ['Triple R', p.trashOutCompleteAt ? 'Trash-out complete' : bid && !bid.approvedAt ? 'Bid waiting for approval' : p.servicesOrderedAt ? 'Services in progress' : 'Not ordered',
      latest(Rx.last(p.tripleRUpdates), p.trashOutCompleteAt, p.servicesOrderedAt, bid && bid.receivedAt)],
    ['AFS', p.resecureConfirmedAt ? 'Re-secure confirmed' : p.servicesOrderedAt ? 'Re-secure requested' : p.occupancyResult ? `Occupancy result: ${p.occupancyResult}` : p.occupancyOrderedAt ? 'Occupancy check ordered' : 'Not ordered',
      latest(p.resecureConfirmedAt, p.occupancyResultAt, p.occupancyOrderedAt)],
    ['ESD', !occ ? 'Not needed' : p.evictionCompleteAt ? 'Eviction complete' : p.esdReferredAt ? 'Eviction in progress' : 'Referral needed',
      occ ? latest(p.evictionCompleteAt, Rx.last(p.evictionCheckins), p.esdReferredAt) : null],
    ['BPO vendor', p.valuesReceivedAt ? 'Values received' : p.valuesOrderedAt ? 'BPO ordered, no value yet' : 'Not ordered', latest(p.valuesReceivedAt, p.valuesUpdatedAt, p.valuesOrderedAt)]
  ];
}
function renderProperty(root, id) {
  const p = findProperty(id); if (!p) return notFound(root, id);
  const t = clock.today(), d = derive(p, t), na = d.nextAction;
  const hit = na.ruleId ? d.hits.find(h => h.ruleId === na.ruleId) : null;
  const dom = domOf(p, t), live = Rx.live(p).length;
  const field = (l, v) => `<div><div class="upper">${esc(l)}</div><div class="b">${esc(v)}</div></div>`;
  const head = `<section class="card pd-head" id="pd-head"><a class="back-link" href="#/portfolio">${I('arrowLeft', 16)} Back</a>
    <div class="page-head mt8"><div><h1>${esc(p.street)}</h1><div class="subtitle">${esc(`${cityLine(p)} · Loan ${p.loan}`)}</div></div><div class="actions">${slaChip(p, d)}</div></div>
    <div class="pd-facts-row">${field('Investor', p.investor)}${field('Broker', p.broker)}${field('Occupancy', occLabel(p))}${field('Days in portfolio', fmtInt(Rx.dip(p, t)))}${field('DOM', dom == null ? 'Not listed' : fmtInt(dom))}</div></section>`;
  const stepper = `<section class="card mt16"><div class="card-h"><h2>Lifecycle</h2><span class="small muted">${esc(`${d.stageLabel} · day ${d.daysInStage} in stage`)}</span></div>${stepperHtml(p, d, t)}</section>`;
  const issues = `<section class="card" id="pd-issues"><div class="card-h"><h2>Open issues on this file</h2><span class="small muted">${esc(plural(d.hits.length, 'item'))}</span></div><div style="padding:8px 20px 12px">
    ${d.hits.length ? d.hits.map(h => `<div class="issue-row" data-pid="${p.id}" data-rule="${esc(h.ruleId)}"><div class="min0"><div class="b">${esc(h.title)}</div><div class="row wrap mt8">${kindChip(h)}${categoryChip(h.category)}</div></div>
      <div class="min0"><div class="er-gap">${esc(h.gapText)}</div><div class="er-reason">${esc(h.reason)}</div></div>
      <button class="btn btn-outline btn-sm" data-review data-rule="${esc(h.ruleId)}" data-pid="${p.id}">${h.ruleId === 'A-01' ? 'Execute' : 'Review'}</button></div>`).join('') : emptyOk('No open issues on this file.')}</div></section>`;
  const tl = p.timeline.map((e, i) => ({ e, i })).sort((a, b) => (b.e.at - a.e.at) || (b.i - a.i)).map(x => x.e);
  const timeline = `<section class="card mt16" id="pd-timeline"><div class="card-h"><h2>Timeline</h2><span class="small muted">${tl.length} entries, newest first</span></div><div class="tl">
    ${tl.map(e => `<div class="tl-item tl-${esc(e.kind)}"><span class="muted">${esc(fmtDash(e.at))}</span><span class="tl-src">${esc(e.source)}</span><span>${esc(e.text)}</span></div>`).join('')}</div></section>`;
  const label = na.kind === 'today' ? 'Execute' : hit && hit.template && !['EX-01', 'A-04', 'EX-10'].includes(hit.ruleId) ? 'Review & send' : 'Review';
  const btn = hit ? `<button class="btn btn-primary" id="pd-primary" data-review data-rule="${esc(hit.ruleId)}" data-pid="${p.id}">${esc(label)}</button>`
    : na.kind === 'waiting' ? '<a class="btn btn-outline" href="#/awaiting">View in Awaiting response</a>' : '';
  const next = `<section class="na-card" id="pd-next"><div class="upper">Next action</div><div class="na-big">${esc(na.text)}</div>
    <div class="small muted">${esc(agentSummary(p, d, hit))}</div>
    ${hit ? `<div class="row wrap mt12">${agentChip(hit.agent, hit.category)}</div>` : ''}
    <div class="row mt12">${btn}${d.moreIssues ? `<span class="more-issues">+${plural(d.moreIssues, 'more issue')}</span>` : ''}</div></section>`;
  // Agents on this file: a compact card for every agent working on one of the file's hits
  const agRes = [];
  d.hits.forEach(h => agentsForRule(h.ruleId, p).forEach(a => { const r = agentResult(a, p, t, h); if (r) agRes.push(r); }));
  const watcher = SAMPLE.agents.find(a => a.id !== 'am' && a.stages.includes(d.stage)) || agentInfo('am');
  const agentsPanel = `<section class="card" id="pd-agents"><div class="card-h"><h2>Agents on this file</h2><span class="small muted">${esc(agRes.length ? plural(agRes.length, 'agent result') : 'Nothing to review')}</span></div><div class="ag-list">
    ${agRes.length ? agRes.map(r => agentCard(r, { compact: true, reviewBtn: true })).join('')
      : `<section class="ag-card compact" data-agent="${esc(watcher.id)}" data-status="WATCHING"><div class="ag-head"><span class="ag-kicker">${esc(watcher.kicker)}</span><span class="ag-name">${esc(agentName(watcher.id))}</span><span class="chip chip-grey ag-status">WATCHING</span></div><div class="ag-decision mt8">Watching: nothing to review</div><div class="small muted">${esc(watcher.summary)}</div></section>`}</div></section>`;
  const kv = [['BPO value', fmtMoney(p.bpoValue)], ['Bot-reviewed value', fmtMoney(p.botValue)], ['Agreed value', fmtMoney(p.agreedValue)], ['List price', fmtMoney(p.listPrice)], ['Reserve', fmtMoney(p.reserve)], ['Starting bid', fmtMoney(p.startingBid)]];
  const facts = `<section class="card card-pad mt16" id="pd-facts"><h2 class="mb8">Key facts</h2><dl class="kv" style="padding:0 0 8px">${kv.map(([l, v]) => `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`).join('')}
    <dt>Offers</dt><dd>${p.offers.length ? `<a href="#/offers/${p.id}" id="pd-offers-link">${esc(plural(live, 'live offer'))}</a>` : '0'}</dd></dl>
    <div class="upper mt12 mb8">Vendor status · last update</div>${vendorRows(p).map(([v, s, at]) => `<div class="vend-row"><span class="b">${esc(v)}</span><span>${esc(s)}</span><span class="muted">${at ? esc(fmtMD(at)) : '\u2014'}</span></div>`).join('')}</section>`;
  root.innerHTML = head + stepper + `<div class="pd-grid"><div>${issues}${timeline}</div><div>${next}${agentsPanel}${facts}</div></div>`;
  // Re-run: 600 ms thinking state, then the agent run is logged (DB.agentLog + timeline) and the page re-renders
  bindAgentCard($('#pd-agents', root), {
    rerun(o, card) {
      card.classList.add('thinking');
      setTimeout(() => { const r = actions.rerunAgent(o.propertyId, o.agentId); toast(r.ok ? `${agentName(o.agentId)} re-ran on ${p.street} (simulated).` : 'Already handled'); refresh(); }, 600);
    }
  });
}

/* ---------------------------------------------------------------------
   S4 OFFERS (#/offers list, #/offers/:id comparison). The recommendation
   is computed in the generator (recommendOffer); the decision itself
   goes through the S7 offer drawer.
   --------------------------------------------------------------------- */
const OFFER_ACTION = { accept: 'Accept', counter: 'Counter', hb: 'Call Highest & Best', reject: 'Reject' };
const pctText = x => `${Math.round(x * 1000) / 10}%`;
function offerStatusChip(o, onHero) {
  const cls = o.order === 0 ? (onHero ? 'chip chip-white' : 'sla-chip sla-today') : o.order === 1 ? 'chip chip-amber-o' : o.order === 2 ? 'chip chip-blue-o' : 'chip chip-grey';
  return `<span class="${cls}" data-status>${esc(o.status)}</span>`;
}
function offerCard(o) {
  const { p, best, count, rec } = o, hero = o.order === 0;
  return `<a class="card offer-card ${hero ? 'hero' : ''}" href="#/offers/${p.id}" data-offer="${p.id}">
    <div class="row"><span class="b">${esc(p.street)}</span><span class="spacer"></span>${offerStatusChip(o, hero)}</div>
    <div class="xs muted">${esc(`${cityLine(p)} · ${p.investor}`)}</div>
    <div class="oc-best">${esc(fmtMoney(best.amount))} <small>best of ${esc(plural(count, 'offer'))}</small></div>
    <div class="small">${esc(`${pctText(best.amount / p.listPrice)} of list · ${pctText(best.amount / p.reserve)} of reserve · list ${fmtMoney(p.listPrice)}`)}</div>
    <div class="small mt8 ${hero ? '' : 'muted'}">${esc(rec ? `${agentName(rec.agent)}: ${rec.summary}` : 'No recommendation yet')}${rec ? `<span class="ag-conf">${esc(` · Confidence ${offerLogic(p, clock.today(), {}).confidence.level}`)}</span>` : ''}</div></a>`;
}
function renderOffers(root) {
  const list = selectors.offers(clock.today());
  const appr = list.filter(o => o.order === 0).length, needs = list.filter(o => o.order === 1).length;
  root.innerHTML = pageHead('Offers', `${plural(list.length, 'file')} with live offers · ${appr} investor-approved · ${needs} need a decision`)
    + (list.length ? `<div class="offer-grid" id="offer-list">${list.map(offerCard).join('')}</div>` : `<div class="card mt16" style="padding:0 20px">${emptyOk('No live offers right now.')}</div>`);
}
// Every offer as a dot over time, against the list price (steps at each reduction) and the reserve (dashed)
function offerChart(p, t) {
  const liveSet = new Set(Rx.live(p));
  const offers = p.offers.filter(o => liveSet.has(o) || dayDiff(o.receivedAt, t) <= 90);
  if (!offers.length || !p.listPrice) return '<div class="muted small">No offers to chart.</div>';
  const W = 720, H = 240, L = 72, R = 16, T = 12, B = 30;
  const x0 = new Date(Math.min(...offers.map(o => +o.receivedAt), p.listedAt ? +p.listedAt : Infinity)), x1 = t;
  const prior = p.priceChanges.filter(c => c.at <= x0);
  const v0 = prior.length ? prior[prior.length - 1].to : (p.priceChanges.length ? p.priceChanges[0].from : p.listPrice);
  const steps = [{ at: x0, v: v0 }].concat(p.priceChanges.filter(c => c.at > x0).map(c => ({ at: c.at, v: c.to })));
  const resv = v => v * p.reserve / p.listPrice;   // the reserve follows the list price
  const vals = offers.map(o => o.amount).concat(steps.map(s => s.v), steps.map(s => resv(s.v)));
  const lo = Math.min(...vals) * 0.96, hi = Math.max(...vals) * 1.03, span = (x1 - x0) || DAY_MS;
  const X = d => (L + (d - x0) / span * (W - L - R)).toFixed(1), Y = v => (T + (1 - (v - lo) / (hi - lo)) * (H - T - B)).toFixed(1);
  const stepPath = fn => `M${X(steps[0].at)} ${Y(fn(steps[0].v))}` + steps.slice(1).map(s => ` H${X(s.at)} V${Y(fn(s.v))}`).join('') + ` H${X(x1)}`;
  const color = o => (o.status === 'live' ? 'var(--primary)' : o.status === 'countered' ? 'var(--warn)' : 'var(--faint)');
  const ticks = [0, 1, 2, 3].map(i => lo + (hi - lo) * i / 3);
  const key = (sw, l) => `<span class="row" style="gap:5px">${sw}${esc(l)}</span>`;
  return `<svg class="chart" id="oc-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Offers over time against list price and reserve">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 8}" y="${(Number(Y(v)) + 4).toFixed(1)}" text-anchor="end">${esc(fmtMoney(round100(v)))}</text>`).join('')}
    <path d="${stepPath(v => v)}" fill="none" stroke="var(--stage-mkt)" stroke-width="2"/>
    <path d="${stepPath(resv)}" fill="none" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/>
    ${offers.map(o => `<circle cx="${X(o.receivedAt)}" cy="${Y(o.amount)}" r="5.5" fill="${color(o)}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(`${o.buyer} · ${fmtMoney(o.amount)} · ${o.financing} · received ${fmtMD(o.receivedAt)} · ${o.status}`)}</title></circle>`).join('')}
    <text class="ax" x="${L}" y="${H - 8}">${esc(fmtMD(x0))}</text><text class="ax" x="${W - R}" y="${H - 8}" text-anchor="end">${esc(fmtMD(x1))} (today)</text></svg>

/* ---------------------------------------------------------------------
   S7 REVIEW & SEND DRAWER (DESIGN 6.7): single, bulk and decision variants

const MERGE_FIELDS = ['address', 'city', 'loan', 'investor', 'party', 'daysInGap', 'daysOutstanding', 'requestType', 'submitted', 'followupNo', 'listPrice', 'amount', 'amName'];
const DRAWER_VARIANT = { 'EX-01': 'checklist', 'A-04': 'value', 'EX-10': 'value', 'A-05': 'bid', 'A-06': 'route', 'A-07': 'listing', 'A-03': 'reduction', 'EX-12': 'reduction', 'A-02': 'offer', 'EX-14': 'offer', 'A-01': 'execute', 'EX-15': 'execute', 'C-04': 'brokercheck' };
let reviewClose = null;

function parseDollars(v) { const s = String(v == null ? '' : v).trim().replace(/[$,\s]/g, ''); return /^\d+$/.test(s) ? Number(s) : NaN; }
function unknownFields(text) {
  const out = [];
  String(text).replace(/\{([^{}\s]*)\}/g, (m, k) => { if (!MERGE_FIELDS.includes(k) && !out.includes(m)) out.push(m); return m; });
  return out;
}
function messageErrors(subject, body) {
  const e = [], s = String(subject).trim(), b = String(body);
  if (!s) e.push('Subject is required'); else if (s.length > 200) e.push('Keep the subject under 200 characters');
  if (!b.trim()) e.push('Body is required'); else if (b.length > 5000) e.push('Keep the body under 5,000 characters');
  unknownFields(`${subject}\n${body}`).forEach(f => e.push(`Unknown field: ${f}`));

}
const reconciled = p => (p.bpoValue && p.botValue ? round100((p.bpoValue + p.botValue) / 2) : p.bpoValue || p.botValue || null);
function compsFor(base, id) { return [0.95 + (id % 5) / 100, 0.99 + (id % 3) / 100, 1.03 + (id % 4) / 100].map(m => round100(base * m)); }

// Evidence panel: the facts the agent gathered (label / value rows)
function evidenceRows(p, hit, t) {

  const pc = x => `${Math.round(x * 1000) / 10}%`;
  add('Stage', `${d.stageLabel} · day ${d.daysInStage} in stage`);
  add('Days in gap', hit.gapText);
  add('Finding', hit.reason);
  if (is('EX-01')) {

    add('Order date (Triple R)', md(p.servicesOrderedAt)); add('Last vendor update', md(Rx.last(p.tripleRUpdates)));
    add('Re-secure confirmed (AFS)', md(p.resecureConfirmedAt));
    if (p.trashOutBid) add('Trash-out bid', `${fmtMoney(p.trashOutBid.amount)} · received ${md(p.trashOutBid.receivedAt)}${p.trashOutBid.approvedAt ? ` · approved ${md(p.trashOutBid.approvedAt)}` : ''}`);
  }
  if (is('EX-08', 'EX-09', 'C-03', 'EX-10', 'A-04') || (id === 'EX-07' && !p.valuesReceivedAt)) {
    add('Order date (BPO)', md(p.valuesOrderedAt)); add('Last vendor update (BPO)', md(p.valuesUpdatedAt || p.valuesOrderedAt));
    add('BPO value', p.bpoValue ? `${fmtMoney(p.bpoValue)} · ${md(p.valuesReceivedAt)}` : 'Not received');
    add('Bot-reviewed value', p.botValue ? `${fmtMoney(p.botValue)} · ${md(p.botValueAt)}` : 'Not received');
    const rv = p.bpoValue && p.botValue ? reconciled(p) : null;
    if (rv) { add('Reconciled value', `${fmtMoney(rv)} (difference ${pc(Math.abs(p.bpoValue - p.botValue) / rv)})`); add('Comps (3 sold within 1 mile)', compsFor(rv, p.id).map(fmtMoney).join(' · ')); }
  }
  if (is('EX-11', 'A-07')) {

    add('Investor', `${p.investor}${investorOf(p).requiresInitialListApproval ? ' (requires initial list approval)' : ''}`);
  }
  if ((is('EX-12', 'A-03', 'C-04') || id === 'EX-13') && p.listedAt) {
    add('Listed', `${md(p.listedAt)} · ${plural(Rx.since(p.listedAt, t), 'day')} on market (DOM)`);
    add('List price', fmtMoney(p.listPrice)); add('Reserve', fmtMoney(p.reserve));
    add('Last price change', p.priceChanges.length ? `${md(Rx.lastPrice(p))} · ${fmtMoney(Rx.last(p.priceChanges).from)} to ${fmtMoney(Rx.last(p.priceChanges).to)}` : 'None');
    if (p.hubzu) add('Hubzu metrics', `${fmtInt(p.hubzu.views)} page views · ${fmtInt(p.hubzu.watchers)} watchers · ${fmtInt(p.hubzu.showings)} showing requests`);
    add('Last broker check', md(Rx.last(p.brokerChecks)));

  if (is('A-02', 'EX-14', 'A-01', 'EX-15') || (id === 'EX-13' && Rx.live(p).length)) {
    const live = Rx.live(p).slice().sort((a, b) => b.amount - a.amount), best = live[0], rec = p.recommendation;
    if (best) {
      add('Best offer', `${fmtMoney(best.amount)} · ${best.financing} · buyer ${best.buyer} · received ${md(best.receivedAt)}`);
      add('Offers', `${plural(live.length, 'live offer')} · best is ${pc(best.amount / p.listPrice)} of list, ${pc(best.amount / p.reserve)} of reserve`);
      add('List price / reserve', `${fmtMoney(p.listPrice)} / ${fmtMoney(p.reserve)}`);
    }
    if (rec) { add('Agent recommendation', `${rec.summary} · ${rec.routeText}`); rec.bullets.forEach((b, i) => add(i ? ' ' : 'Rationale', b)); }
    const ap = hit.approvalId && p.approvals.find(a => a.id === hit.approvalId);
    if (ap) add('Investor approval', `${ap.action === 'accept' ? 'Accept' : 'Counter'} at ${fmtMoney(ap.amount)} · approved ${md(ap.approvedAt)}`);
  }
  if (id === 'EX-13') {
    const q = p.investorRequests.find(r => r.id === hit.requestId);
    if (q) {
      add('Request', `${SAMPLE.requestTypes[q.type]}${q.amount ? ` at ${fmtMoney(q.amount)}` : ''} · ${p.investor}`);
      add('Submitted', md(q.submittedAt)); add('Days outstanding', fmtInt(dayDiff(q.submittedAt, t)));
      add('Follow-ups sent', fmtInt(q.followups.length)); add('Last follow-up', md(Rx.last(q.followups)));
    }
  }
  if (id === 'EX-17') { add('Contract executed', md(p.contractAt)); add('Scheduled closing date', md(p.closingDate)); }
  add('Loan', p.loan);
  return R;
}

// Offer decision: route text and amber warnings (DESIGN 6.4 / 7)
function offerRoute(x, dec) {
  const p = x.p, best = bestLive(p), rec = p.recommendation, n = parseDollars(dec.amount), warns = [];
  if (dec.action === 'hb') return { route: 'none', text: 'No approval needed to call Highest & Best', warns };
  if (dec.action === 'reject') return { route: 'none', text: 'Within AM authority: offers are rejected', warns };
  if (n > 0) {
    if (rec && rec.amount && n < rec.amount) warns.push(`Below the agent's recommendation of ${fmtMoney(rec.amount)}`);
    if (n < p.reserve) warns.push(`Below reserve (${fmtMoney(p.reserve)})`);
  }
  const pct = SAMPLE.sla.delegatedAcceptPctOfList, fin = best ? best.financing : '';
  const within = dec.action === 'accept' && n >= p.listPrice * pct / 100 && n >= p.reserve && ['Cash', 'Conventional'].includes(fin) && !warns.length;
  let text;
  if (within) text = 'Within AM authority: the acceptance goes to the broker';
  else if (warns.length) text = 'Investor approval required';
  else if (dec.action === 'counter') text = 'Counter: investor approval required';
  else if (n > 0 && n < p.listPrice * pct / 100) text = `Below ${pct}% of list: investor approval required`;
  else text = `${fin || 'Financing'}: investor approval required`;
  return { route: within ? 'authority' : 'investor', text, warns };
}

// Which template and party the message uses for the current decision
function msgSpec(st, x) {
  const { hit } = x, dec = st.dec;
  switch (st.variant) {
    case 'checklist': case 'value': return null;
    case 'offer': {
      if (dec.action === 'hb' || dec.action === 'reject') return null;
      const r = offerRoute(x, dec), n = parseDollars(dec.amount), over = { amount: n > 0 ? fmtMoney(n) : '' };
      return r.route === 'authority' ? { tplId: 'BRK-ACCEPT-01', partyKey: 'broker', over } : { tplId: 'INV-OFFER-01', partyKey: 'investor', over };
    }
    case 'reduction': { const n = parseDollars(dec.price); return { tplId: 'INV-REDUCTION-01', partyKey: 'investor', over: { amount: n > 0 ? fmtMoney(n) : '' } }; }
    case 'listing': { const n = parseDollars(dec.price); return { tplId: hit.template, partyKey: hit.party, over: { listPrice: n > 0 ? fmtMoney(n) : '' } }; }
    case 'bid': return { tplId: 'TR-BID-01', partyKey: 'tripleR' };
    case 'execute': return { tplId: 'BRK-EXECUTE-01', partyKey: 'broker' };
    default: return hit.template ? { tplId: hit.template, partyKey: hit.party } : null;
  }
}
function varsFor(x, spec) { return Object.assign(mergeVars(x.p, Object.assign({}, x.hit, { party: spec.partyKey })), spec.over || {}); }
/** draftMessage(x, spec) -> { subject, body, cc }: the agent's filled draft for one file ({ p, hit }) and msgSpec() result. */
function draftMessage(x, spec) {
  const tpl = tplById(spec.tplId), v = varsFor(x, spec);
  return { subject: fillTemplate(tpl.subject, v), body: fillTemplate(tpl.body, v), cc: v._cc || '' };
}

        case 'offer': {
          const needsAmount = dec.action === 'accept' || dec.action === 'counter', r = offerRoute(x, dec);
          if (needsAmount) { const n = parseDollars(dec.amount); if (!(n > 0)) dErr.push('Enter a whole-dollar amount above 0'); else if (n > 2 * p.listPrice) dErr.push(`The amount can be at most 2x the list price (${fmtMoney(2 * p.listPrice)})`); }
          r.warns.forEach(w => warns.push(w));
          q('#rv-route').textContent = r.text;
          q('#rv-amount').disabled = !needsAmount;
        } break;
        default: break;
      }
      if (spec && !st.mixed) messageErrors(st.subject, st.body).forEach(e => errs.push(e));
      if (spec && !bulk && !partyInfo(p, spec.partyKey).email) errs.push(`No contact on file for ${partyInfo(p, spec.partyKey).label}`);
      const dm = q('#rv-dec-msg');
      if (dm) dm.innerHTML = dErr.map(e => `<div class="rv-err">${esc(e)}</div>`).join('') + warns.map(w => `<div class="rv-warn">${I('warning', 13)} ${esc(w)}</div>`).join('');
      q('#rv-errs').innerHTML = errs.map(e => `<div>${esc(e)}</div>`).join('');
      const blocked = errs.length > 0 || dErr.length > 0 || (bulk && !st.selected.size);
      const btn = q('#rv-primary'); btn.disabled = blocked; btn.textContent = primaryLabel();
      return !blocked;
    };
    const onDecision = () => {
      if (st.variant === 'offer') { const r = q('input[name=rv-action]:checked'); dec.action = r ? r.value : dec.action; dec.amount = q('#rv-amount').value; }
      if (st.variant === 'reduction' || st.variant === 'listing') dec.price = q('#rv-price').value;
      if (st.variant === 'value') { dec.reviewed = q('#rv-reviewed').checked; dec.value = q('#rv-value').value; }
      syncMsg(); validate();
    };
    const submit = () => {
      if (!validate()) return;
      const x = cur(), p = x.p, msg = { subject: st.subject, body: st.body };
      let res, text = '', refs = [{ propertyId: p.id, ruleId }];
      switch (st.variant) {
        case 'checklist': res = actions.completeChecklist(p.id); text = `Intake checklist completed for ${p.street} (simulated).`; break;
        case 'value': {
          res = actions.agreeValue(p.id, { reviewed: dec.reviewed, value: String(dec.value).trim() ? parseDollars(dec.value) : '' });
          text = `Value agreed at ${fmtMoney(p.agreedValue)} for ${p.street} (simulated).`; break;
        }
        case 'reduction': {
          const n = parseDollars(dec.price); res = actions.requestReduction(p.id, Object.assign({ price: n }, msg));
          text = `Reduction request to ${fmtMoney(n)} sent to ${p.investor} (simulated).${expText(res)}`; break;
        }
        case 'listing': {
          const n = parseDollars(dec.price);
          // Reserve and starting bid from the Set Reserve Price decision: the edited values, else the recommendation
          const sd = latestDecision(p, 'srp', 'A-07', t), sr = agentResult('srp', p, t, x.hit);
          const sv = (sd && sd.decision === 'edit' && sd.values) || (sr && sr.decision.values) || {};
          const rb = { reserve: sv.reserve, startingBid: sv.startingBid };
          res = x.hit.needsApproval ? actions.sendInitialListRequest(p.id, Object.assign({ amount: n }, rb, msg)) : actions.listProperty(p.id, Object.assign({ listPrice: n }, rb, msg));
          text = x.hit.needsApproval ? `Initial list request at ${fmtMoney(n)} sent to ${p.investor} (simulated).${expText(res)}` : `${p.street} pushed to market at ${fmtMoney(n)} (simulated).`; break;
        }
        case 'offer': {
          const r = offerRoute(x, dec), n = parseDollars(dec.amount), needsAmount = dec.action === 'accept' || dec.action === 'counter';
          res = actions.decideOffer(p.id, Object.assign({ action: dec.action, amount: needsAmount ? n : undefined, requireApproval: r.route === 'investor' }, msg));
          text = res.route === 'authority' ? `Acceptance at ${fmtMoney(n)} sent to ${p.broker} (simulated).`
            : res.route === 'investor' ? `Approval request at ${fmtMoney(n)} sent to ${p.investor} (simulated). Status: With investor.${expText(res)}`
            : dec.action === 'hb' ? `Highest & Best called on ${p.street} (simulated).` : `Offers rejected on ${p.street} (simulated).`;
          break;
        }
        case 'execute': res = actions.executeApproved(p.id, msg); text = `Investor-approved decision sent to ${p.broker} (simulated).`; break;
        case 'bid': {
          const sel = selItems(); refs = sel.map(i => ({ propertyId: i.p.id, ruleId }));
          const spec = msgSpec(st, x);
          const out = sel.map(i => { const v = varsFor(i, spec); return actions.approveBid(i.p.id, bulk ? { subject: fillTemplate(st.subject, v), body: fillTemplate(st.body, v) } : msg); });
          const ok = out.filter(r => r.ok);
          res = ok.length ? { ok: true, items: [].concat(...ok.map(r => r.items)) } : out[0];
          text = `${plural(ok.length, 'Triple R bid')} approved (simulated).${expText(res)}`; break;
        }
        default: {
          const sel = selItems(); refs = sel.map(i => ({ propertyId: i.p.id, ruleId }));
          res = actions.send(refs, st.mixed ? {} : { subject: st.subject, body: st.body, cc: st.cc });
          if (res.ok) text = sendToast(res, rule, bulk ? st.noContact.size : 0);
        }
      }
      finishAction(res, text, refs, closeAll, dr);
    };

    // Bulk list: checkbox toggles selection, clicking a row highlights it for the preview
    if (bulk) q('#rv-list').addEventListener('click', e => {
      const li = e.target.closest('.rv-li'); if (!li) return;
      const id = Number(li.dataset.pid);
      if (e.target.matches('input[type=checkbox]')) { if (e.target.checked) st.selected.add(id); else st.selected.delete(id); }
      st.hl = id; $$('.rv-li', dr).forEach(el => el.classList.toggle('on', Number(el.dataset.pid) === id));
      renderAgents(); renderEvidence(); syncMsg(); renderTo(); renderPreview(); validate();
    });
    q('#rv-dec-wrap').addEventListener('input', onDecision);
    q('#rv-dec-wrap').addEventListener('change', onDecision);
    q('#rv-primary').addEventListener('click', submit);
    if (q('#rv-open')) q('#rv-open').addEventListener('click', () => { const id = cur().p.id; closeAll(); go(`#/property/${id}`); });
    if (q('#rv-logcheck')) q('#rv-logcheck').addEventListener('click', () => {
      const sel = selItems(), refs = sel.map(i => ({ propertyId: i.p.id, ruleId }));
      const out = sel.map(i => actions.logCheck(i.p.id, ruleId)), ok = out.filter(r => r.ok).length;
      finishAction(ok ? { ok: true } : out[0], `${plural(ok, 'broker check')} logged, no email (simulated).`, refs, closeAll, dr);
    });
    // Snooze 1 day: reason required, note optional up to 500 characters
    const sn = q('#rv-snooze');
    const snValidate = () => {
      const n = q('#rv-sn-note').value.length, c = q('#rv-sn-count');
      c.textContent = `${n} / 500`; c.classList.toggle('bad', n > 500);
      q('#rv-sn-go').disabled = n > 500 || !q('input[name=rv-sn]:checked') || (bulk && !st.selected.size);
    };
    q('#rv-snooze-btn').addEventListener('click', () => { sn.classList.toggle('hidden'); snValidate(); });
    q('#rv-sn-cancel').addEventListener('click', () => sn.classList.add('hidden'));
    sn.addEventListener('input', snValidate); sn.addEventListener('change', snValidate);
    q('#rv-sn-go').addEventListener('click', () => {
      const reason = q('input[name=rv-sn]:checked').value, note = q('#rv-sn-note').value;
      const sel = selItems(), refs = sel.map(i => ({ propertyId: i.p.id, ruleId }));
      const out = sel.map(i => actions.snooze({ propertyId: i.p.id, ruleId }, reason, note)), ok = out.filter(r => r.ok).length;
      finishAction(ok ? { ok: true } : out[0], `${plural(ok, 'file')} snoozed for 1 day: ${reason}.`, refs, closeAll, dr);
    });

    renderList(); renderAgents(); renderEvidence(); syncMsg(); validate();
    const first = $$('input, textarea, select', dr).find(el => !el.disabled && el.offsetParent !== null);
    if (first) first.focus({ preventScroll: true });   // keep the agents panel at the top in view
  });
  return reviewClose;
}

const ROUTES = [
  { path: '/', screen: 'command', nav: 'command' },
  { path: '/portfolio', screen: 'portfolio', nav: 'portfolio' },
  { path: '/offers', screen: 'offers', nav: 'offers' },
  { path: '/offers/:id', screen: 'offer', nav: 'offers' },
  { path: '/investor-requests', screen: 'investor', nav: 'investor' },
  { path: '/awaiting', screen: 'awaiting', nav: 'awaiting' },
  { path: '/property/:id', screen: 'property', nav: null },
  { path: '/agents', screen: 'agents', nav: 'agents' },
  { path: '/agents/:id', screen: 'agent', nav: 'agents' }
];
function parseHash() {
  const raw = (location.hash || '#/').slice(1) || '/';
  const i = raw.indexOf('?');
  return { path: (i < 0 ? raw : raw.slice(0, i)) || '/', query: new URLSearchParams(i < 0 ? '' : raw.slice(i + 1)) };
}
function matchRoute(path) {
  const parts = path.split('/');
  for (const r of ROUTES) {
    const rp = r.path.split('/'); if (rp.length !== parts.length) continue;
    const params = []; let ok = true;
    for (let k = 0; k < rp.length && ok; k++) {
      if (rp[k].startsWith(':')) { if (!parts[k]) ok = false; else { try { params.push(decodeURIComponent(parts[k])); } catch (e) { ok = false; } } }
      else if (rp[k] !== parts[k]) ok = false;
    }
    if (ok) return { route: r, params };
  }
  return null;
}
function renderScreen() {
  const c = shell.current, content = $('#content');
  if (!c || !content) return;
  try { SCREENS[c.route.screen](content, c.params, c.query); }
  catch (e) { console.error('Screen failed to render:', c.route.screen, e); content.innerHTML = `<div class="empty-state"><h3>This screen failed to render</h3><div>Check the browser console for details.</div></div>`; }
}
// Re-render the current screen and sidebar badges after an action or clock change (keeps drawers and toasts).
function refresh() {
  const c = shell.current; if (!c || !$('#sidebar')) return;
  $('#sidebar').innerHTML = renderSidebar(c.route);
  const cs = $('#clock-slot'); if (cs) cs.innerHTML = clockPill();
  renderScreen();
}
// Screens that keep filters in the hash (My Portfolio) write them back without a full route change
function replaceQuery(hash) {
  const before = location.hash;
  location.replace(hash);
  if (location.hash !== before) shell.silentHash = location.hash;
  shell.current.query = parseHash().query;
  renderScreen();
}
function router() {
  const silent = shell.silentHash; shell.silentHash = null;
  if (silent && silent === location.hash && shell.current) return;   // already rendered by replaceQuery()
  const { path, query } = parseHash();
  if (path === '/demo') { shell.startDemo = true; location.replace('#/'); return; }   // #/demo: start the guided demo on the Command Center
  const m = matchRoute(path);
  if (!m) { console.warn('Unknown route:', path); shell.pendingToast = "That page isn't in the prototype"; location.replace('#/'); return; }
  $('#overlay-root').innerHTML = '';
  $$('.toast').forEach(t => t.remove());
  shell.current = { route: m.route, params: m.params, query };
  $('#app').innerHTML = `<div class="app"><aside class="sidebar" id="sidebar">${renderSidebar(m.route)}</aside><div class="main-col"><header class="topbar" id="topbar">${renderTopbar()}</header><main class="content" id="content"></main>
    <footer class="footer"><span>\u00a9 2026 ${esc(SAMPLE.meta.company)}. Fictional sample data.<span class="ver">${esc(SAMPLE.meta.version)}</span></span><span>${esc(MOCK)}</span></footer></div></div>`;
  bindTopbar();
  renderScreen();
  window.scrollTo(0, 0);
  document.title = `${SAMPLE.meta.appName} \u00b7 ${m.route.screen} (Prototype)`;
  if (shell.pendingToast) { toast(shell.pendingToast); shell.pendingToast = null; }
  if (shell.startDemo) { shell.startDemo = false; setTimeout(() => demo.start({ returnHash: '#/' }), 0); }
}

        route    the hash the step shows; anchor = CSS selector (or ctx => selector) to spotlight

        perform  what Next does on screen: clicks the real buttons, pausing so each change is visible

function demoHit(pid, ruleId) { const p = findProperty(pid), hit = p && derive(p, clock.today()).hits.find(h => h.ruleId === ruleId); return hit ? { p, hit } : null; }

/** demoCtx(): the files the tour works on, read from the fresh demo DB (fixed seed, so the ids are stable). */
function demoCtx() {
  const hs = selectors.hits(null, clock.today()), of = id => hs.filter(x => x.hit.ruleId === id);
  const ex07 = of('EX-07').sort((x, y) => y.hit.daysInGap - x.hit.daysInGap).map(x => ({ propertyId: x.p.id, ruleId: 'EX-07' }));

  const nudge = of('EX-13').find(x => x.p.investorRequests.some(q => q.id === x.hit.requestId && q.type === 'initial'));

/* Clicks a real element as the AM would: spotlight it, pause, click, pause. sel = selector or list (first match wins). */
async function demoTap(sel, wait = 350) {
  if (!demo.alive(demo.performTok)) throw DEMO_ABORT;
  const el = [].concat(sel).map(s => $(s)).find(Boolean);
  if (!el) { console.warn('Demo: nothing to click for', sel); return false; }
  el.scrollIntoView({ block: 'center' }); demo.position(el, true);
  await sleep(250);
  if (!demo.alive(demo.performTok)) throw DEMO_ABORT;
  el.click();
  await sleep(wait);
  return true;
}

/* navigate(hash): resolves once the router has rendered the hash (or at once, after refresh(), when it is already shown). */
function navigate(hash) {
  return new Promise(resolve => {
    if (location.hash === hash) { refresh(); resolve(); return; }
    let done = false;
    const fin = () => { if (done) return; done = true; window.removeEventListener('hashchange', fin); resolve(); };
    window.addEventListener('hashchange', fin);
    setTimeout(fin, 1500);
    location.hash = hash;
  });
}
function demoCloseOverlays() {
  if (reviewClose) reviewClose();
  $$('#overlay-root [data-close]').forEach(b => b.click());   // modals: their own close removes the Escape listener
  const root = $('#overlay-root'); if (root) root.innerHTML = '';
}
