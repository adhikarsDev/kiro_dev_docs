const demo = {
  active: false, index: 0, paused: false, driving: false, ready: false, saved: null, ctx: null, timer: null,
  run: 0, performTok: 0, anchorSel: null, anchorFound: false, onMove: null,
  alive(tok) { return this.active && tok === this.run; },

  async start(o = {}) {
    if (this.active) return;
    try {
      const h = o.returnHash || location.hash || '#/';
      this.saved = { DB, offset: clock.offset, hash: h === '#/demo' ? '#/' : h,
        cc: Object.assign({}, ccView, { expanded: Object.assign({}, ccView.expanded) }), pf: Object.assign({}, pfView),
        invUnchecked: new Set(invView.unchecked), hub: Object.assign({}, hubView) };
      demoCloseOverlays();
      this.active = true; this.index = 0; this.paused = false;
      document.body.classList.add('demo-on');
      this.build(); demoRenderTopbar();
      this.onMove = () => this.watch();
      window.addEventListener('resize', this.onMove);
      window.addEventListener('scroll', this.onMove, true);
      this.timer = setInterval(() => this.watch(), 250);
    } catch (e) { console.warn('Demo failed to start:', e); return; }
    await this.goTo(0);
  },

  exit() {
    if (!this.active) return;
    this.run++;
    const s = this.saved;
    clearInterval(this.timer); this.timer = null;
    window.removeEventListener('resize', this.onMove); window.removeEventListener('scroll', this.onMove, true);
    try { demoCloseOverlays(); } catch (e) { console.warn('Demo: closing overlays failed', e); }
    const layer = $('#demo-layer'); if (layer) layer.remove();
    document.body.classList.remove('demo-on');
    Object.assign(this, { active: false, paused: false, driving: false, ready: false, saved: null, ctx: null, anchorSel: null, anchorFound: false });
    if (s) {
      DB = s.DB; clock.offset = s.offset;
      Object.assign(ccView, s.cc); Object.assign(pfView, s.pf); invView.unchecked = s.invUnchecked; Object.assign(hubView, s.hub);
    }
    const msg = 'Demo ended. Your data is back as it was before the demo.', hash = s ? s.hash : '#/';
    if (location.hash !== hash) { shell.pendingToast = msg; location.hash = hash; }
    else { demoRenderTopbar(); refresh(); toast(msg); }
  },

  async next() {
    if (!this.active || this.driving) return;
    const tok = ++this.run, k = this.index, s = TOUR_STEPS[k];
    this.driving = true; this.setReady(false);
    try {
      if (this.paused) { await this.enter(k, tok); if (!this.alive(tok)) return; this.driving = true; this.setReady(false); }
      if (s.perform && !(s.done && s.done(this.ctx))) { this.performTok = tok; await s.perform(this.ctx); }
    } catch (e) { if (e !== DEMO_ABORT) console.warn('Demo step failed:', s.id, e); }
    if (!this.alive(tok)) return;
    if (k >= TOUR_STEPS.length - 1) { this.exit(); return; }
    await this.enter(k + 1, tok);
  },

  back() { if (!this.active || this.driving || this.index === 0) return Promise.resolve(); return this.goTo(this.index - 1); },

  // Rebuilds the demo DB at offset 0, replays apply() for the steps before k, then enters step k
  async goTo(k) {
    if (!this.active) return;
    const tok = ++this.run;
    k = Math.max(0, Math.min(Number(k) || 0, TOUR_STEPS.length - 1));
    this.driving = true; this.setReady(false);
    try {
      demoCloseOverlays();
      clock.offset = 0; buildFreshDB(); demoResetViews();
      this.ctx = demoCtx();
      for (let i = 0; i < k; i++) {
        const st = TOUR_STEPS[i];
        if (st.apply) { try { st.apply(this.ctx); } catch (e) { console.warn('Demo replay failed:', st.id, e); } }
      }
    } catch (e) { console.warn('Demo reset failed:', e); }
    await this.enter(k, tok);
  },

  async enter(k, tok) {
    if (tok == null) tok = ++this.run;
    const s = TOUR_STEPS[k]; if (!s || !this.alive(tok)) return;
    Object.assign(this, { index: k, paused: false, driving: true, anchorSel: null, anchorFound: false });
    this.setReady(false); this.renderCoach();
    try {
      await navigate(s.route(this.ctx));
      if (!this.alive(tok)) return;
      if (s.open && !(s.done && s.done(this.ctx))) s.open(this.ctx);
      await sleep(150);
      if (!this.alive(tok)) return;
      const a = this.resolveAnchor(s);
      this.anchorSel = a.sel; this.anchorFound = a.primary;
      this.renderCoach();
      if (a.el) {
        const tall = a.el.getBoundingClientRect().height > window.innerHeight * 0.6;
        a.el.scrollIntoView({ block: tall ? 'start' : 'center' });
        if (tall && !a.el.closest('.drawer')) window.scrollBy(0, -80);   // clear the sticky top bar
      }
      this.position(a.el);
    } catch (e) { console.warn('Demo step failed:', s.id, e); }
    if (!this.alive(tok)) return;
    this.driving = false; this.setReady(true);
  },

  resolveAnchor(s) {
    const find = sel => { try { const el = sel ? $(sel) : null; return el && el.getClientRects().length ? el : null; } catch (e) { return null; } };
    let primary = null; try { primary = typeof s.anchor === 'function' ? s.anchor(this.ctx) : s.anchor; } catch (e) { console.warn('Demo anchor failed:', s.id, e); }
    let el = find(primary); if (el) return { el, sel: primary, primary: true };
    el = find(s.fallbackAnchor); return el ? { el, sel: s.fallbackAnchor, primary: false } : { el: null, sel: null, primary: false };
  },

  // Pauses when the AM leaves the step's screen or its anchor disappears (e.g. Escape closed the drawer)
  watch() {
    if (!this.active || this.driving || this.paused) return;
    const s = TOUR_STEPS[this.index]; if (!s) return;
    let route = null; try { route = s.route(this.ctx); } catch (e) { /* treated as moved away */ }
    const el = this.anchorSel ? $(this.anchorSel) : null;
    if (location.hash !== route || (this.anchorSel && !el)) { this.pause(); return; }
    this.position(el);
  },

  pause() {
    this.paused = true; this.setReady(false);
    const spot = $('#demo-spot'), coach = $('#demo-coach'), pz = $('#demo-paused');
    if (spot) spot.classList.add('hidden');
    if (pz) pz.classList.remove('hidden');
    if (coach) {
      coach.classList.remove('demo-centered');
      coach.style.left = Math.max(12, document.documentElement.clientWidth - coach.offsetWidth - 16) + 'px';
      coach.style.top = Math.max(12, window.innerHeight - coach.offsetHeight - 16) + 'px';
    }
  },

  /* position(el, spotOnly): spotlight the visible part of el; put the coach right of, below, left of or above it
     (the first that fits), clamped to the viewport. No el = centered coach without a spotlight. */
  position(el, spotOnly) {
    const spot = $('#demo-spot'), coach = $('#demo-coach'); if (!spot || !coach) return;
    const vw = document.documentElement.clientWidth, vh = window.innerHeight, M = 12, G = 14, P = 6;
    if (!el) { spot.classList.add('hidden'); if (!spotOnly) { coach.classList.add('demo-centered'); coach.style.left = ''; coach.style.top = ''; } return; }
    const b = el.getBoundingClientRect(), cw = coach.offsetWidth, ch = coach.offsetHeight;
    const r = { left: Math.max(b.left, M) - P, top: Math.max(b.top, M) - P, right: Math.min(b.right, vw - M) + P, bottom: Math.min(b.bottom, vh - M) + P };
    if (r.bottom - r.top <= 2 * P || r.right - r.left <= 2 * P) { spot.classList.add('hidden'); return; }   // scrolled out of view
    const place = () => [
      [r.right + G, r.top, r.right + G + cw <= vw - M],
      [r.left, r.bottom + G, r.bottom + G + ch <= vh - M],
      [r.left - G - cw, r.top, r.left - G - cw >= M],
      [r.left, r.top - G - ch, r.top - G - ch >= M]
    ].find(f => f[2]);
    let at = place();
    // A tall, wide anchor leaves no room: spotlight its top part and keep the coach below it
    if (!at && !spotOnly) { r.bottom = Math.max(r.top + 60, vh - M - ch - G); at = place(); }
    spot.classList.remove('hidden');
    Object.assign(spot.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.right - r.left}px`, height: `${r.bottom - r.top}px` });
    if (spotOnly) return;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));
    at = at || [vw - cw - M, vh - ch - M];
    coach.classList.remove('demo-centered');
    coach.style.left = `${clamp(at[0], M, vw - cw - M)}px`; coach.style.top = `${clamp(at[1], M, vh - ch - M)}px`;
  },

  build() {
    const old = $('#demo-layer'); if (old) old.remove();
    const layer = document.createElement('div'); layer.id = 'demo-layer';
    layer.innerHTML = `<div id="demo-spot" class="hidden"></div>
      <div id="demo-coach" class="demo-centered" role="dialog" aria-labelledby="demo-title" aria-describedby="demo-body" data-step="1" data-step-id="" data-ready="0">
        <div class="dc-h"><div class="dc-k">Guided demo · <span id="demo-count"></span></div><div id="demo-title"></div></div>
        <div id="demo-body"></div>
        <div id="demo-paused" class="hidden"><div class="b mb8">You moved away from this step.</div><button class="btn btn-primary btn-sm" id="demo-resume">Resume the tour</button></div>
        <div class="dc-f"><button class="btn btn-ghost btn-sm" id="demo-exit">Exit demo</button><span class="spacer"></span><button class="btn btn-outline btn-sm" id="demo-back">Back</button><button class="btn btn-primary btn-sm" id="demo-next">Next</button></div>
      </div>`;
    document.body.appendChild(layer);
    $('#demo-coach').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      if (b.id === 'demo-next') this.next();
      else if (b.id === 'demo-back') this.back();
      else if (b.id === 'demo-exit') this.exit();
      else if (b.id === 'demo-resume' && !this.driving) this.enter(this.index);
    });
  },

  renderCoach() {
    const s = TOUR_STEPS[this.index], c = $('#demo-coach'); if (!s || !c) return;
    let body = ''; try { body = s.body(this.ctx) || ''; } catch (e) { console.warn('Demo copy failed:', s.id, e); }
    c.dataset.step = String(this.index + 1); c.dataset.stepId = s.id;
    $('#demo-count').textContent = `Step ${this.index + 1} of ${TOUR_STEPS.length}`;
    $('#demo-title').textContent = s.title;
    $('#demo-body').innerHTML = String(body).split('\n\n').map(x => `<p>${esc(x)}</p>`).join('');
    $('#demo-paused').classList.toggle('hidden', !this.paused);
    this.syncButtons();
  },

  setReady(v) { this.ready = !!v; const c = $('#demo-coach'); if (c) c.dataset.ready = v ? '1' : '0'; this.syncButtons(); },
  syncButtons() {
    const b = $('#demo-back'), n = $('#demo-next'), r = $('#demo-resume');
    if (b) b.disabled = this.driving || this.index === 0;
    if (n) { n.disabled = this.driving; n.textContent = this.index === TOUR_STEPS.length - 1 ? 'Finish' : 'Next'; }
    if (r) r.disabled = this.driving;
  },

  state() { const s = TOUR_STEPS[this.index]; return { active: this.active, index: this.index, stepId: this.active && s ? s.id : null, paused: this.paused, ready: this.ready, anchorFound: this.anchorFound }; }
};
window.AMP.demo = { start: o => demo.start(o), exit: () => demo.exit(), next: () => demo.next(), back: () => demo.back(), goTo: k => demo.goTo(k), state: () => demo.state(), steps: TOUR_STEPS.map(s => s.id) };

/* ---- Boot: dark-mode preference, the shared Review buttons, the router, then ?demo=1 ---- */
try { if (localStorage.getItem('amp-dark') === '1') document.body.classList.add('dark'); } catch (e) { /* storage blocked */ }
// Any [data-review] button (single file) or [data-bulk] button (whole group) on any screen opens the S7 drawer
document.addEventListener('click', e => {
  const r = e.target.closest('[data-review]');
  if (r && !r.closest('.drawer')) { e.preventDefault(); openReview({ mode: 'single', ruleId: r.dataset.rule, propertyIds: [r.dataset.pid] }); return; }
  const b = e.target.closest('[data-bulk]');
  if (b && !b.closest('.drawer')) {
    e.preventDefault();
    const ids = selectors.hits().filter(x => x.hit.ruleId === b.dataset.bulk).sort((x, y) => y.hit.daysInGap - x.hit.daysInGap).map(x => x.p.id);
    openReview({ mode: 'bulk', ruleId: b.dataset.bulk, propertyIds: ids });
  }
});
window.addEventListener('hashchange', router);
router();
try { if (new URLSearchParams(location.search).get('demo') === '1') setTimeout(() => demo.start(), 0); } catch (e) { /* no query support */ }
</script>
</body>
</html>
